<!-- ============================================================================
 NOTE TO WHOEVER (Claude or Wendell) OPENS THIS FILE NEXT — read this first.
 This comment is the only place these instructions live. Nothing outside this
 file (no script, no /tmp scratch work from a past session) is needed to edit
 this pack by hand. A past session's own build tooling does not survive between
 sessions — this comment does, because it travels with the file.

 WHAT THIS FILE IS
 One HTML file is one "pack" (a store of games) for Terminal Velocity's
 Cartridges app. Each game lives as one block, right here in <body>:
   <script type="text/plain" class="cartsrc" data-meta=X JSON X>
     ...the game's complete, self-contained game.html, verbatim...
   </script>
 (X above stands for a single quote — written as one here only so this comment
 itself can't be mistaken for a real game block by a script that scans the
 file for that exact data-meta pattern)
 The data-meta JSON has at least {"id":"gameid", ...the game's own fields}.
 Inside a game's own HTML, every literal `</script` must be written `<~/script`
 and every literal `<!--` must be written `<~!--`, so the browser's parser
 doesn't end this wrapper script early. Nothing else needs escaping. When
 adding or editing a game by hand, do that escaping yourself; when a build
 script does it, it must do exactly that and nothing more.

 THIS FILE'S OWN HEAD METAS (keep these as they are)
   <meta name="cartridges-pack" content="core">
   <meta name="cartridges-pack-name" content="Core cartridges">
 "core" is THE first, default pack — the OS always loads it, it can't be
 switched off, and its id never changes.

 ADDING A GAME TO *THIS* PACK
 Paste in a new <script type="text/plain" class="cartsrc" data-meta=X...X>
 block (X = single quote, same shape as the ones already here), escaped as above. Give it an id
 that doesn't collide with any id already in this file, or in any other pack
 this file lists below. An id, once shipped, is never renamed or reused — a
 player's save is keyed to it.

 MAKING A *NEW* SEPARATE PACK (a second store) — READ THIS FIRST
 If you are a fresh Claude session starting Wendell's SECOND (or third, or
 Nth) cartridge pack and he's handed you only this file for reference: the
 OS now finds extra packs on its own. After loading this file (and any pack
 named below in cartridges-more, if one is listed), it also tries, in the
 same folder: cartridges-2.html, then cartridges-3.html, cartridges-4.html,
 and so on. It stops once TWO tries in a row come back missing — a 404, or
 a file that doesn't contain any cartsrc blocks (so a soft-404 page can't
 fool it) — so a single gap is tolerated but not two in a row. Up to 60
 numbers are tried. This means: for an ordinary new pack, you make ONE new
 file and Wendell uploads it next to this one. THIS file (cartridges.html)
 does not need to change, does not need a rebuild, and does not need a
 cartridges-more edit, to pick up a new numbered pack.
 1. Name the new file cartridges-N.html, where N is the next number not
    already in use (nothing yet → cartridges-2.html; that exists → the next
    one is cartridges-3.html; etc. — ask Wendell which numbers already exist
    if you're not sure). This exact "cartridges-" prefix is REQUIRED, not
    just a convention: it's what gets the CORS header a saved/offline copy
    of the OS needs to fetch the file, and what the auto-discovery above
    looks for. Numbers are NEVER reused, even once a pack is retired. Don't
    skip more than one number in a row — skipping two or more permanently
    hides every pack after the gap, since discovery stops there for good.
 2. Give the new file this exact same shape as this one: doctype/head, then
    one <script class="cartsrc"> block per game in its body, same format,
    same escaping rules, as described above. Its head needs:
      <meta name="cartridges-pack" content="SHORT-ID">
      <meta name="cartridges-pack-name" content="Display Name">
    The display name is what players see in the Store — it does NOT come
    from the filename ("cartridges-2.html" can show as "Rising Sun"). Always
    ask Wendell what it should be; never invent one. SHORT-ID is a short
    lowercase slug unique to this pack, used only internally, never shown.
 3. Every game id in the new pack must be globally unique across every pack
    that exists anywhere — use a short prefix per pack (e.g. ids like
    "rs-dawnrun" for a "Rising Sun" pack) so it can never collide with
    "core" or any other pack's ids. Never rename or reuse an id once
    shipped — a player's save is keyed to it. If two packs ever do share an
    id, whichever loads first wins and the later one is hidden with a
    warning — so check against every other pack's ids (ask Wendell, or have
    him paste you the other pack files) before shipping.
 4. Guideline, not a hard cap: keep each pack to roughly 20 games / 3MB — the
    OS downloads a whole pack before it can show anything in it, and
    Wendell's Chromebook and phone both feel a slow one.
 5. Per-game saves live in localStorage shared across the whole OS (~5MB
    total, ~600KB hard cap per game) — keep a game's save to a few KB.
 6. Test the new pack file served over plain HTTP before it goes anywhere
    near republicka.life — e.g. `python3 -m http.server` in the folder that
    holds it and open it that way, not as a bare file:// page.
 7. Packs are cached offline: THIS file (the "core" pack) is re-checked
    every time Cartridges opens, but any extra pack — named or numbered —
    is re-checked at most once a day, or when a player presses "Check for
    updates". So a same-day edit to an already-installed extra pack's games
    may not show up for a day for people who already have the OS.
 8. Retiring a pack: just delete the file. A player with none of its games
    installed loses that store entry on their next check; a player who
    still has one of its games installed keeps seeing the pack until they
    uninstall it. Never reuse that pack's number for a different pack.

 An alternate path exists for a pack that genuinely needs a name that ISN'T
 the next sequential number: list its bare filename (no path, no URL;
 letters/digits/./_/- only; must live in this same folder) in a comma-
 separated cartridges-more meta, added right after cartridges-pack-name
 above, e.g.:
   
 (max 40 names, every one must match cartridges-*.html or the OS rejects
 it; comma-separate for more than one). A pack listed by name here always
 wins over the same file found by number, and named packs show before
 numbered ones, in the order listed. This is the exception, not the rule —
 for almost every new pack, just upload cartridges-N.html and touch
 nothing in this file at all.

 Nothing about the OS itself (the Cartridges app, install/uninstall, Backup)
 is decided here — that's a different, OS-side file Wendell maintains with
 OS Claude.
============================================================================ -->

  +'<td><span class="dim" style="font-size:11.5px">'+esc(ev.join("; "))+'</span></td><td style="white-space:nowrap">'

  +'<p>Deina teaches how DNA works by having you read it, and asks what we owe the animals we have lost. The name is from the Greek <i>deinos</i>, which means both wondrous and terrible at once, and which is the <i>dino</i> in dinosaur. Sophocles has a chorus sing that many things are wondrous and terrible, and none more so than a human being.</p>'

function act(a,k,t){switch(a){
 case"close":closeModal();break;
 case"lounge":closeModal();if(view==="bench"&&RUN){G.run=RUN;gsave()}setView("lounge");break;
 case"board":closeModal();setView("board");break;case"shop":setView("shop");break;case"shelf":setView("shelf");break;
 case"codex":case"note":G.tab=G.tab||"genes";setView("codex");break;

 case"tab":G.tab=k;renderCodex();break;
 case"resume":if(RUN||resumeRun())setView("bench");break;case"howto":howTo();break;case"settings":settingsModal();break;
 case"guide":G.guide=!G.guide;gsave();settingsModal();if(view==="bench")refresh();break;
 case"snd":G.snd=!G.snd;gsave();settingsModal();renderSnd();if(!G.snd)hush();break;
 case"sndq":G.snd=!G.snd;gsave();renderSnd();if(!G.snd)hush();else ac();break;
 case"mark":G.mark=k;if(RUN)RUN.mark=k;gsave();settingsModal();break;
 case"reset":{const b=$("breset");if(b&&b.dataset.sure){G=DEF();G.welcomed=true;RUN=null;JB=null;gsave();closeModal();setView("lounge");toast("Everything is erased. The laboratory is new.")}
  else if(b){b.dataset.sure=1;b.textContent="Tap again to erase everything"}break}
 case"pickrow":{const s=+k;if(starsAvail().indexOf(s)<0){toast(LOCKT(s)+".",1);break}offerJob(s);break}
 case"another":offerJob(OFFER.stars);break;case"start":closeModal();openRun(OFFER);break;
 case"seedgo":{const s=cleanSeed($("seedin").value);if(s.length<8){toast("A code is eight letters and numbers, like 7K2M-9QXA.",1);break}
  OFFER={seed:s.slice(0,4)+"-"+s.slice(4,8),stars:starsAvail().slice(-1)[0]};showOffer();break}
 case"buy":{const x=SBY[k];if(!x||G.bought[x.id])break;if(G.money<x.p){toast("Not enough credits.",1);break}

 case"donate":{const sel=document.querySelector('select[data-o="'+k+'"]'),w=sel&&G.shelf[+sel.value];if(!w||w.gave)break;
  const o=ORGS.find(x=>x.id===k);w.gave=k;G.gave++;const r=rng("don"+w.seed+o.id);
  G.letters.unshift({t:"A letter from "+o.n.toLowerCase(),b:"The line has arrived. We decided to "+o.use+". "+pick(r,THANKS)
   +" We never learned the name of whoever read the sample, only a small mark beside a date. Thank you.",n:G.jobs});
  gsave();renderGive();toast("Handed over. A letter will come.");break}
 case"appr":{if(G.appr.length>=6||G.money<320)break;G.money-=320;G.appr.push({n:ANAMES[(G.appr.length*5+G.jobs)%ANAMES.length]});
  G.letters.unshift({t:"Your new student, "+G.appr[G.appr.length-1].n,b:"I wanted to start with something extinct. You gave me twelve swabs from living animals and made me read every one. I understand now: you cannot judge damage until you know what undamaged looks like.",n:G.jobs});

 case"school":{if(G.school||G.money<1600)break;G.money-=1600;G.school=true;

  gsave();renderGive();break}
 /* the bench */
 case"tool":TOOL=k;renderTools();DIRTY=true;break;
 case"card":if(JB)modal('<p class="meta">'+JB.year+' · '+esc(JB.cust.trade)+'</p><h2>'+esc(JB.cust.name)+'</h2>'

let AC=null,OUT=null;
function ac(){if(!G.snd)return null;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=1;OUT.connect(AC.destination)}

function burst(t,len,f,q,g,f2,type){const a=AC,b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*len)),a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type||"bandpass";
 fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+len);fl.Q.value=q;
 const gn=a.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(OUT);s.start(t)}
function tone(t,f,g,dec,type){const a=AC,o=a.createOscillator(),gn=a.createGain();o.type=type||"sine";
 o.frequency.setValueAtTime(f,t);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.006);
 gn.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(gn);gn.connect(OUT);o.start(t);o.stop(t+dec+.02)}

 if(k==="seq"){for(let i=0;i<14;i++)tone(t+i*.045,520+((i*7)%4)*90,.045,.06,"square")}
 else if(k==="align"){tone(t,420,.05,.1);tone(t+.07,560,.05,.12)}
 else if(k==="copy"){for(let i=0;i<5;i++)tone(t+i*.05,300+i*70,.05,.09,"triangle")}
 else if(k==="cut"){burst(t,.05,2600,2,.07);burst(t+.05,.05,2200,2,.06);tone(t+.02,180,.05,.1)}
 else if(k==="patch"){tone(t,330,.05,.12,"triangle");tone(t+.09,494,.05,.16,"triangle");burst(t,.1,900,1,.02)}
 else if(k==="grow"){for(let i=0;i<8;i++)burst(t+i*.09,.07,240+i*40,5,.03);tone(t+.6,262,.04,.6,"sine")}
 else if(k==="tick")tone(t,880,.03,.04,"square")}

 try{const o=AC.createOscillator(),gn=AC.createGain(),f=AC.createBiquadFilter();

 else if(view==="lounge"&&now-LASTP>110){LASTP=now;const c=$("lport");if(c&&LJ)portrait(c,LJ,now)}}

/* ---------- instrument species: the founders breeding draws from ---------- */
/* body: a shape id the renderer knows how to draw. voice: the string's own fixed
   character (sus=ring/decay, soft=how damped/breathy vs. bright the pluck is,
   room=natural resonance). n: string count. warm: a -1..1 axis used only for
   naming (dark/iron names vs. bright/gilt names), not for sound. */
/* voice tuning grounded in how each real instrument actually sounds:
   - Qanun: many sympathetic strings over a wide wooden soundboard — the brightest,
     most metallic, shimmering/ringing of the set ("rings like a bell tower").
   - Psaltery: metal strings over a box resonator — clear, bright, almost glassy.
   - Harp: bell-like clarity with no damper, so notes ring on a long time — bright
     but a touch warmer than qanun/psaltery; famous for very long natural sustain.
   - Koto: silk/nylon strings plucked with picks — balanced, can go soft or hard,
     sits in the middle of the brightness range with a clean, moderate decay.
   - Lyre: gut strings over a small soundbox (turtle shell/small wood frame) — warm
     but the small body means it decays faster than the bigger instruments here.
   - Oud: warm, mellow, rounded — fretless lute players favor a shorter, fast-decaying
     pluck over a long ring, unlike the zithers and harp in this set.
   - Guqin: the darkest and quietest by far, but famous for its long, breathing decay —
     notes are subtle but linger. */
const SPECIES=[
 {id:"harp",name:"Harp",body:"harp",n:11,voice:{sus:.80,soft:.32,room:.60},warm:.1,color:"#d9b45c"},
 {id:"lyre",name:"Lyre",body:"lyre",n:9,voice:{sus:.42,soft:.48,room:.28},warm:.3,color:"#c98a4a"},

 {id:"guqin",name:"Guqin",body:"guqin",n:7,voice:{sus:.92,soft:.68,room:.58},warm:-.8,color:"#4a6a5a"}
];
function speciesOf(id){return SPECIES.find(s=>s.id===id)||SPECIES[0]}

/* ---------- bred-name generator ----------
   Names are blended from the parents along the same "warm" axis used to pick a
   register, then assembled from syllable banks -- never a literal splice of the
   parents' own name strings (that reliably produces ugly, unreadable results). */
const SYL_DARK_A=["Nyx","Thal","Mor","Vael","Sorr","Um","Kael","Dros","Ash","Vey"];
const SYL_DARK_B=["indor","assia","ileth","orac","yssa","aveth","undir","ethra","omir","ancia"];
const SYL_WARM_A=["Sol","Aur","Lyr","Thei","Cal","Ori","Hesp","Gild","Pyr","Ser"];
const SYL_WARM_B=["anthe","adys","essian","oria","ythe","andra","elion","assara","inel","aphyr"];
const EPITHETS=["of the Hollow String","of the Last Chord","of Quiet Strings","of the Low Room","of the Thread","of the First Dusk","of Still Air","of the Long Dusk","of the Open Hand","of the Narrow Light",null,null,null,null];
function pick(a,rnd){return a[Math.floor(rnd()*a.length)]}
function breedName(warmth,rnd){
 /* warmth in -1..1 steers which syllable banks lead; a little of the other
    bank gets mixed in too, so the name still carries both parents. */
 const leadWarm=rnd()<clamp(.5+warmth*.5,.05,.95);
 const Aset=leadWarm?SYL_WARM_A:SYL_DARK_A, Bset=leadWarm?SYL_WARM_B:SYL_DARK_B;
 const AsetMix=leadWarm?SYL_DARK_A:SYL_WARM_A, BsetMix=leadWarm?SYL_DARK_B:SYL_WARM_B;
 const a=rnd()<.78?pick(Aset,rnd):pick(AsetMix,rnd);
 const b=rnd()<.78?pick(Bset,rnd):pick(BsetMix,rnd);
 let nm=a+b;
 const ep=pick(EPITHETS,rnd);
 return ep?nm+" "+ep:nm;
}

/* Every shape is drawn in a 120x160 box so cards and the stage can both use it.
   n strings are always actually drawn (clamped to a sane range for legibility),
   so string count is something you can SEE, not just a number in a tooltip. */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;

 return"#"+(r<<16|g<<8|b).toString(16).padStart(6,"0")}

 } else if(shape==="psaltery"){

   milestone slots. Positions are illustrative, not a planetarium. */

 let arcs="";for(let i=0;i<pts.length-1;i++)arcs+=`<line x1="${pts[i].px.toFixed(1)}" y1="${pts[i].py.toFixed(1)}" x2="${pts[i+1].px.toFixed(1)}" y2="${pts[i+1].py.toFixed(1)}" stroke="#7a7aa8" stroke-width="1" opacity=".5"/>`;

  stars+=`<g class="starpt" data-i="${i}">
   ${lit?`<circle cx="${p.px.toFixed(1)}" cy="${p.py.toFixed(1)}" r="${(r*2.4).toFixed(1)}" fill="url(#glow)"/>`:""}
   <circle cx="${p.px.toFixed(1)}" cy="${p.py.toFixed(1)}" r="${r.toFixed(1)}" fill="${lit?"#fff8e0":"#4a4a6a"}" stroke="${lit?"#ffe9a8":"#6a6a8a"}" stroke-width="1"/>

/* ---------- audio engine: the Karplus-Strong string, ported from Lyre ---------- */
function instrString(sr,f,secs,seed,dec,soft){

function instrRoom(ctx,secs){const sr=ctx.sampleRate,n=Math.floor(sr*(secs||1.6)),b=ctx.createBuffer(2,n,sr);

/* ---------- the phrase generator: how an instrument plays itself, ported from Lyre ---------- */
function phrase(n,scaleIdx,pat,st){

 const ch=big?[0,4,7]:[0,2,4],pr=big?[0,9,5,7]:L>=7?[0,5,3,4]:[0,3,1,4];
 const r=pr[(st.bar++)%pr.length];
 const lo=Math.floor(n*.45);
 const walk=()=>{st.mel=st.mel==null?lo+2:st.mel+pickA([-2,-1,-1,0,1,1,2]);st.mel=Math.max(lo,Math.min(n-1,st.mel));return st.mel};
 const fit=(b,seq)=>{const f=seq.filter(d=>b+d>=0&&b+d<=n-1);return f.length>=3?f.map(d=>b+d):seq.map(d=>fd(b+d))};
 switch(pat%22){
  case 0:N(r,.62,1);N(r+ch[2],.36,.5);N(r+ch[1]+L,.34,.5);if(st.bar%2)N(r+ch[2]+L,.42,1);else if(R()<.2)Z(1);else N(walk(),.5,1);break;
  case 1:{N(r,.5,1);const f=fit(r,[ch[0],ch[1],ch[2],L+ch[0],L+ch[1],L+ch[2]]);f.forEach((d,k)=>N(d,.26+.5*k/f.length,.75));Z(1.5);break}
  case 2:{const len=4+rnd(4),a=rnd(Math.max(1,n-len));T(r%L,.4);for(let k=0;k<2*len;k++){const d=k<=len?a+k:a+2*len-k;N(d,.3+.3*Math.sin(Math.PI*k/(2*len)),.75)}Z(1);break}
  case 3:{const c=2+rnd(3);for(let k=0;k<c;k++)N(lo+rnd(Math.max(1,n-lo)),.22+R()*.3,.25+R()*.3);if(R()<.15)N(r,.32,.5);Z(1.5+R()*3);break}
  case 4:{const c1=r+ch[1]+L,c2=r+ch[2]+L;N(r,.68,.5);N(c2,.4,.5);N(c1,.4,.5);N(c2,.42,.5);N(r+ch[2],.62,.5);N(c2,.4,.5);N(R()<.5?walk():c1,.55,.5);N(c2,.4,.5);break}

  case 6:{const dr=st.bar%4===0?(big?5:L>=7?3:1):0;T(dr,.58);N(dr+ch[2],.36,2.5);if(R()<.7)N(n-1-rnd(Math.min(4,n)),.2,2+R()*2);else Z(2);Z(1.5);break}
  case 7:{if(!st.mo||st.mc<=0){const len=4+rnd(3);st.mo=[];let d=0;for(let k=0;k<len;k++){st.mo.push(d);d+=pickA([-2,-1,-1,1,1,2])}
    st.rh=pickA([[1,1,2,1,1,2],[1.5,.5,1,1.5,.5,2],[.5,.5,1,.5,.5,1,2],[1,2,1,2,1,3]]);st.mc=4;st.at=lo+rnd(Math.max(1,Math.ceil(n*.35)))}
   st.mc--;const sh=pickA([0,0,1,-1,2]);st.mo.forEach((d,k)=>N(Math.max(0,st.at+d+sh),.42+.2*R(),st.rh[k%st.rh.length]));Z(R()<.5?1:2);break}
  case 8:{const cs=[r+ch[0],r+ch[1],r+ch[2],r+L+ch[0]];cs.forEach((d,k)=>{const last=k===cs.length-1;o.push({i:fd(d),v:.5+.04*k,g:last?2.2:0,s:last?undefined:.085})});N(walk(),.5,1);N(walk(),.45,1.5);break}
  case 9:{st.at=st.at==null?lo:Math.max(Math.floor(n*.25),Math.min(n-4,st.at+pickA([-2,-1,1,2])));

/* ---------- breeding ---------- */
function blend(a,b,w,rnd,jitter){const base=a+(b-a)*w;const j=jitter?(rnd()-rnd())*jitter:0;return base+j}
function breedInstrument(pa,pb,rnd){
 const w=.3+rnd()*.4+(rnd()<.5?0:0); // weight toward one parent, never a flat 50/50 every time
 let n=clamp(Math.round(blend(pa.n,pb.n,w,rnd,1.4)),5,16);
 if(rnd()<.12)n=clamp(n+(rnd()<.5?-3:3),5,16); // rare wildcard: a notably sparser or denser instrument
 let sus=clamp(blend(pa.voice.sus,pb.voice.sus,w,rnd,.09),.15,.97);
 let soft=clamp(blend(pa.voice.soft,pb.voice.soft,w,rnd,.09),.05,.95);
 let room=clamp(blend(pa.voice.room,pb.voice.room,w,rnd,.08),.1,.85);
 if(rnd()<.1)sus=rnd()<.5?clamp(sus-.3,.1,.97):clamp(sus+.3,.1,.97);
 if(rnd()<.1)soft=rnd()<.5?clamp(soft-.3,.05,.95):clamp(soft+.3,.05,.95);
 const warm=blend(pa.warm,pb.warm,w,rnd,.15);
 const body=rnd()<w?pa.body:pb.body;
 const mainC=blend2hex(pa.color,pb.color,w),accC=blend2hex(pb.color,pa.color,w);
 const name=breedName(warm,rnd);
 const gen=Math.max(pa.gen||1,pb.gen||1)+1;
 return{id:"dt"+freshSeed().toString(36),name,custom:"",body,color:mainC,accent:accC,n,warm,
  voice:{sus,soft,room},gen,parents:[pa.name,pb.name],seed:(freshSeed()>>>0)};
}
function blend2hex(h1,h2,w){const n1=parseInt(h1.slice(1),16),n2=parseInt(h2.slice(1),16);
 const r=Math.round(((n1>>16)*(1-w))+((n2>>16)*w)),g=Math.round(((n1>>8&255)*(1-w))+((n2>>8&255)*w)),b=Math.round(((n1&255)*(1-w))+((n2&255)*w));
 return"#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0")}

function founderInstance(sp){return{id:"f_"+sp.id,name:sp.name,custom:"",body:sp.body,color:sp.color,accent:shade(sp.color,40),
 n:sp.n,warm:sp.warm,voice:{...sp.voice},gen:1,parents:null,seed:hashStr(sp.id),founder:sp.id}}

/* ---------- seed codec ---------- */
function encodeSeed(inst){const j=JSON.stringify({nm:inst.name,cu:inst.custom,bd:inst.body,co:inst.color,ac:inst.accent,n:inst.n,wa:inst.warm,v:inst.voice,g:inst.gen,p:inst.parents,sd:inst.seed});

function decodeSeed(s){if(!s||!s.startsWith("DT1-"))return null;try{const j=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
 return{id:"dt"+freshSeed().toString(36),name:j.nm,custom:j.cu||"",body:j.bd,color:j.co,accent:j.ac,n:j.n,warm:j.wa,voice:j.v,gen:j.g,parents:j.p,seed:j.sd}}catch(e){return null}}

/* ---------- Ariadne's crown: the myth, told in pieces ---------- */
const MYTH=[
 "Ariadne gave Theseus a single thread, and asked only one thing: that he come back for her.",
 "He found what waited in the dark heart of the maze, and did what he had come to do. He did not come back.",
 "Left on the shore at Naxos, she wept until there was nothing left to weep with — and still, for a long while, no one came.",
 "Then Dionysus found her. He did not try to console her the way the others might have. He simply stayed.",
 "When she let herself be loved again, he lifted the crown from her hair and threw it into the night sky, so that no part of her could ever be lost again.",
 "It circles there still, low in the northern sky — a small ring of stars sailors call the Crown. Some still call it hers.",
 "They say nothing thrown into the sky is ever truly gone. Only farther away — and somehow, because of that, easier for anyone to find."
];
/* each star lights on its OWN condition — they are not guaranteed to complete in order
   (e.g. breeding with all 7 founding species can easily happen before 10 total breeds or
   3 gifts), so lit state must never be "the highest milestone reached so far". */
function crownLitArr(S){return crownProgress(S).map(r=>r.done)}
function crownLitCount(S){return crownLitArr(S).filter(Boolean).length}
/* what each star of the crown actually asks of the player, so the Crown screen can say so */
function crownProgress(S){
 const g=(cur,target,label)=>({label,cur:Math.min(cur,target),target,done:cur>=target});
 return[
  g(S.totalMade||0,1,"Breed your first instrument"),
  g(S.grace||0,1,"Give an instrument away as a gift"),
  g(S.maxGen||1,3,"Breed an instrument to generation 3"),
  g(S.maxGen||1,5,"Breed an instrument to generation 5"),
  g(S.totalMade||0,10,"Breed 10 instruments in total"),
  g(S.gifts||0,3,"Give away 3 instruments"),
  g((S.speciesSeen||[]).length,7,"Breed with all 7 founding species")
 ]}
let S=loadSave();
const rnd=mulberry32(freshSeed());
const VIEW={screen:"lounge",tab:"shelf",selA:null,selB:null,pending:null,playId:null};
let bodyEl=null,ctxA=null,engineCache=new Map();

function allParents(){return[...SPECIES.map(founderInstance),...S.inst]}
function findParent(id){return allParents().find(x=>x.id===id)}
function stepDots(cur,total){const row=h("div",{class:"step-row"});for(let i=0;i<total;i++)row.append(h("div",{class:"step-dot"+(i<=cur?" on":"")}));return row}

function renderAll(){
 bodyEl=bodyEl||$("main");
 if(!bodyEl)return;
 if(VIEW.screen!=="play"&&playState){stopPlayState();if(VIEW._playCleanup){VIEW._playCleanup();VIEW._playCleanup=null}}
 bodyEl.innerHTML="";
 if(VIEW.screen==="lounge")renderLounge();
 else if(VIEW.screen==="pick")renderPick();
 else if(VIEW.screen==="reveal")renderReveal();
 else if(VIEW.screen==="play")renderPlay();
}

 card.append(pic);
 const bd=h("div",{class:"bd"});
 bd.append(h("div",{class:"nm"},nmShown));
 if(inst.custom)bd.append(h("div",{class:"sb"},"born ",inst.name));

 const wrap=h("div",{class:"wrap"});

 wrap.append(h("h1",null,"Choose two to breed"));
 const pool=allParents();
 const grid=h("div",{class:"grid"});

 wrap.append(go,h("button",{class:"btn sm",style:"margin-top:8px",onclick:()=>{VIEW.screen="lounge";renderAll()}},"Back"));

/* ---------- reveal ---------- */
function renderReveal(){
 const inst=VIEW.pending;
 const wrap=h("div",{class:"wrap center"});
 const stage=h("div",{class:"stage"});stage.append(h("div",{class:"spotlight"}));
 const pic=h("div",{style:"width:140px;margin:0 auto;position:relative;z-index:1"});pic.innerHTML=bodySVG(inst.body,inst.n,inst.color,inst.accent);
 stage.append(pic);wrap.append(stage);
 const nameEl=h("div",{class:"pix",style:"font-size:20px;color:var(--gold2);margin-top:10px"},inst.name);
 wrap.append(nameEl,h("div",{class:"dim small ui"},"Generation "+inst.gen+" · bred from "+inst.parents.join(" and ")+" · "+inst.n+" strings"));
 const nmRow=h("div",{class:"ui",style:"margin-top:10px"},
  h("label",null,"Give it your own name (optional)"),
  h("input",{type:"text",id:"renameBox",placeholder:inst.name,oninput:e=>{inst.custom=e.target.value}}));
 wrap.append(nmRow);
 const placeBtn=h("button",{class:"btn pri",style:"margin-top:14px"},"Place on the shelf");
 placeBtn.onclick=()=>{
  S.inst.push(inst);S.totalMade=(S.totalMade||0)+1;S.maxGen=Math.max(S.maxGen||1,inst.gen);
  if(inst.parents){for(const sp of SPECIES)if(inst.parents.includes(sp.name)&&!S.speciesSeen.includes(sp.id))S.speciesSeen.push(sp.id)}
  for(const pid of[VIEW.selA,VIEW.selB]){const sp=SPECIES.find(s=>"f_"+s.id===pid);if(sp&&!S.speciesSeen.includes(sp.id))S.speciesSeen.push(sp.id)}
  saveNow(S);VIEW.pending=null;VIEW.selA=null;VIEW.selB=null;VIEW.screen="lounge";VIEW.tab="shelf";renderAll()};
 wrap.append(placeBtn);
 bodyEl.append(wrap);
}

/* ---------- play: manual pluck + autoplay + mood picker ---------- */
let playState=null; // {inst, engine, mood:{scale,root,oct,pat,bpm}, auto, autoT, nextT, st, queue}
async function ensureAudio(){if(!ctxA){ctxA=new(window.AudioContext||window.webkitAudioContext)()}
 if(ctxA.state!=="running"){try{await ctxA.resume()}catch(e){}}return ctxA}
function stopPlayState(){if(playState){clearInterval(playState.autoT);if(playState.engine)try{playState.engine.m.disconnect()}catch(e){}}playState=null}

function renderPlay(){
 const inst=findParent(VIEW.playId);
 if(!inst){VIEW.screen="lounge";renderAll();return}
 if(!playState||playState.inst.id!==inst.id){
  stopPlayState();
  const def=moodDef("Lullaby");
  playState={inst,engine:null,mood:{name:"Lullaby",scale:def.scale,root:def.root,oct:def.oct,pat:def.pat,bpm:def.bpm},auto:false,autoT:null,nextT:0,st:{bar:0},queue:[],cycle:false,cycleNextAt:0};
 }
 const PS=playState;
 const wrap=h("div",{class:"wrap center"});
 const stage=h("div",{class:"stage"});stage.append(h("div",{class:"spotlight"}));
 const pic=h("div",{style:"width:120px;margin:0 auto;position:relative;z-index:1"});pic.innerHTML=bodySVG(inst.body,inst.n,inst.color,inst.accent||inst.color);
 stage.append(pic);
 const strings=h("div",{class:"strings"});
 const svgWrap=h("div",{style:"position:relative;z-index:1"});svgWrap.append(strings);
 stage.append(svgWrap);
 wrap.append(h("div",{style:"font-size:19px;color:var(--gold2);font-weight:700"},inst.custom||inst.name),
  h("div",{class:"dim small ui"},inst.founder?"Founding instrument":"Generation "+inst.gen+" · "+inst.parents.join(" × ")));
 wrap.append(stage);

 function paintStrings(){
  const N=nStrings(inst.n);let svg=`<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<N;i++){const x=20+(380-40)*(N<=1?.5:i/(N-1));
   svg+=`<line class="string-ln" data-i="${i}" x1="${x.toFixed(1)}" y1="10" x2="${x.toFixed(1)}" y2="170" stroke="${inst.color}" stroke-width="2" opacity=".75"/>`}
  svg+="</svg>";strings.innerHTML=svg;
 }
 paintStrings();
 function flashString(i){
  const ln=strings.querySelector(`[data-i="${i}"]`);if(ln){ln.setAttribute("stroke-width","4");setTimeout(()=>ln&&ln.setAttribute("stroke-width","2"),140)}
 }
 async function doPluck(i,vel){
  await ensureAudio();if(!PS.engine)PS.engine=makeEngine(ctxA,inst,.8);
  const t=ctxA.currentTime;PS.engine.pluck(PS.mood.scale,PS.mood.root,PS.mood.oct,i,vel||.75,t);
  flashString(i);
 }
 const pointerHandler=e=>{
  const rect=strings.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const N=nStrings(inst.n),frac=clamp(x/rect.width,0,1);const i=clamp(Math.round(frac*(N-1)),0,N-1);
  doPluck(i);
 };
 strings.addEventListener("pointerdown",pointerHandler);
 VIEW._doPluck=doPluck;
 const keys=["a","s","d","f","g","h","j","k","l",";","'","[","]","\\","shift+a","shift+s"];
 function keyHandler(e){if(e.repeat)return;const idx=keys.indexOf(e.key.toLowerCase());if(idx<0||idx>=nStrings(inst.n))return;doPluck(idx)}
 document.addEventListener("keydown",keyHandler);
 VIEW._playCleanup=()=>{strings.removeEventListener("pointerdown",pointerHandler);document.removeEventListener("keydown",keyHandler)};

 /* mood picker */
 const row=h("div",{class:"row ui ok-row"});
 const moodSel=h("select",null,...moodList().map(nm=>nm===PS.mood.name?h("option",{value:nm,selected:true},nm):h("option",{value:nm},nm)));
 function setMood(name,keepBpm){const d=moodDef(name);PS.mood={name,scale:d.scale,root:d.root,oct:d.oct,pat:d.pat,bpm:keepBpm?PS.mood.bpm:d.bpm};PS.st={bar:0};PS.queue=[];moodSel.value=name;bpmSl.value=PS.mood.bpm}
 moodSel.onchange=e=>setMood(e.target.value,true);
 row.append(h("div",null,h("label",null,"Mood"),moodSel));
 const bpmSl=h("input",{type:"range",min:20,max:160,value:PS.mood.bpm,oninput:e=>PS.mood.bpm=+e.target.value});
 row.append(h("div",null,h("label",null,"Pace"),bpmSl));
 wrap.append(row);
 const cycleRow=h("div",{class:"row ui"});
 const cycleChk=h("input",PS.cycle?{type:"checkbox",checked:true}:{type:"checkbox"});
 cycleChk.onchange=e=>{PS.cycle=e.target.checked;if(PS.cycle)PS.cycleNextAt=(ctxA?ctxA.currentTime:0)+12+rnd()*8};
 cycleRow.append(h("label",{class:"small dim",style:"display:flex;align-items:center;gap:6px;cursor:pointer"},cycleChk,"Wander between moods while it plays"));
 wrap.append(cycleRow);

 const auto=h("button",{class:"btn pri"},PS.auto?"Stop":"Let it play itself");
 auto.onclick=async()=>{
  if(PS.auto){PS.auto=false;clearInterval(PS.autoT);auto.textContent="Let it play itself";return}
  await ensureAudio();if(!PS.engine)PS.engine=makeEngine(ctxA,inst,.8);
  PS.auto=true;auto.textContent="Stop";PS.nextT=ctxA.currentTime+.08;
  if(PS.cycle)PS.cycleNextAt=ctxA.currentTime+12+rnd()*8;
  PS.autoT=setInterval(()=>{
   if(!PS.auto)return;const now=ctxA.currentTime;let guard=0;
   if(PS.cycle&&now>=PS.cycleNextAt){
    const list=moodList().filter(nm=>nm!==PS.mood.name);
    if(list.length)setMood(list[Math.floor(rnd()*list.length)],false);
    PS.cycleNextAt=now+12+rnd()*8;
    toast("Wandering into: "+PS.mood.name);
   }
   while(PS.nextT<now+.2&&guard++<40){
    if(!PS.queue.length)PS.queue=phrase(inst.n,PS.mood.scale,PS.mood.pat,PS.st);
    const it=PS.queue.shift(),beat=60/PS.mood.bpm;
    if(it.i>=0){PS.engine.pluck(PS.mood.scale,PS.mood.root,PS.mood.oct,it.i,it.v,PS.nextT);
     const delay=Math.max(0,(PS.nextT-now)*1000);
     setTimeout(()=>{if(PS.auto)flashString(it.i)},delay);
    }
    PS.nextT+=it.s!=null?it.s:it.g*beat;
   }
  },40);
 };
 wrap.append(auto);

 if(!inst.founder){
  const tools=h("div",{class:"row ui",style:"margin-top:16px"});
  const seedField=h("input",{type:"text",readonly:"",value:encodeSeed(inst),style:"max-width:220px;font-family:monospace;font-size:11.5px"});
  const renameBox=h("input",{type:"text",value:inst.custom||"",placeholder:inst.name,style:"max-width:220px"});
  renameBox.oninput=e=>{inst.custom=e.target.value;saveNow(S);seedField.value=encodeSeed(inst)};
  tools.append(h("div",null,h("label",null,"Rename"),renameBox));
  seedField.onclick=()=>seedField.select();
  const seedBtn=h("button",{class:"btn sm"},"Copy");
  seedBtn.onclick=async()=>{
   const s=seedField.value;let ok=false;
   try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(s);ok=true}}catch(e){}
   if(!ok){try{seedField.focus();seedField.select();ok=document.execCommand("copy")}catch(e){}}
   toast(ok?"Seed copied: "+s.slice(0,18)+"…":"Couldn't auto-copy — seed is selected, press Ctrl/Cmd+C");
  };
  tools.append(h("div",null,h("label",null,"Shareable seed"),h("div",{style:"display:flex;gap:6px;align-items:center;flex-wrap:wrap"},seedField,seedBtn)));
  const giftBtn=h("button",{class:"btn sm"},"Give as a gift");
  giftBtn.onclick=()=>{giftInstrument(inst)};
  tools.append(giftBtn);
  wrap.append(tools);
 }
 const backBtn=h("button",{class:"btn sm",style:"margin-top:14px"},"Back to the shelf");
 backBtn.onclick=()=>{if(VIEW._playCleanup)VIEW._playCleanup();VIEW.screen="lounge";renderAll()};
 wrap.append(backBtn);
 bodyEl.append(wrap);
}
/* loading a shared seed should credit the same things a live breed would, where it can:
   a fresh instrument joins the shelf, counts toward totalMade/maxGen, and any founding
   species named among its parents counts toward the "bred with all 7" crown star. */
function doImportSeed(s){
 const inst=decodeSeed((s||"").trim());if(!inst)return null;
 S.inst.push(inst);S.totalMade=(S.totalMade||0)+1;S.maxGen=Math.max(S.maxGen||1,inst.gen||1);
 if(inst.parents){for(const sp of SPECIES)if(inst.parents.includes(sp.name)&&!S.speciesSeen.includes(sp.id))S.speciesSeen.push(sp.id)}
 saveNow(S);
 toast("Loaded: "+(inst.custom||inst.name));
 return inst.id;
}
function giftInstrument(inst){
 S.inst=S.inst.filter(i=>i.id!==inst.id);
 S.grace=(S.grace||0)+1;S.gifts=(S.gifts||0)+1;saveNow(S);
 if(VIEW._playCleanup)VIEW._playCleanup();
 VIEW.screen="lounge";VIEW.tab="shelf";renderAll();
 toast("Given away, with Grace. Its star stays lit.");
}
let toastT=0;
function toast(t){let e=$("dtoast");if(!e){e=h("div",{id:"dtoast",class:"ui",style:"position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pan2);border:1px solid var(--gold);border-radius:6px;padding:8px 16px;font-size:13.5px;z-index:9;display:none"});document.body.append(e)}
 e.textContent=t;e.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>e.style.display="none",2800);
}
function crownGlyph(){return h("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"1.6"},
 (()=>{const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M4 18l2-9 4 5 2-7 2 7 4-5 2 9z");return p})());}

function boot(){
 const app=h("div",{id:"app"});
 const header=h("header");
 header.append(h("div",{class:"brand"},crownGlyph(),"Divine Tragedy"));
 app.append(header,h("main",{id:"main"}));
 host.append(app);
 bodyEl=$("main");
 renderAll();

 host.RT={
  state(){return{screen:VIEW.screen,tab:VIEW.tab,selA:VIEW.selA,selB:VIEW.selB,grace:S.grace,
   totalMade:S.totalMade,maxGen:S.maxGen,gifts:S.gifts,instCount:S.inst.length,speciesSeen:S.speciesSeen.length,
   litStars:crownLitCount(S)}},
  raw(){return JSON.parse(JSON.stringify(S))},
  goto(scr){VIEW.screen=scr;renderAll();return true},
  pickParents(aId,bId){VIEW.screen="pick";VIEW.selA=aId;VIEW.selB=bId;renderAll();return true},
  breedNow(aId,bId){const pa=findParent(aId),pb=findParent(bId);if(!pa||!pb)return false;
   VIEW.pending=breedInstrument(pa,pb,rnd);VIEW.selA=aId;VIEW.selB=bId;VIEW.screen="reveal";renderAll();return true},
  place(){const b=bodyEl.querySelector("button.btn.pri");if(b&&/shelf/i.test(b.textContent)){b.click();return true}return false},
  playFirstOwned(){if(!S.inst.length)return false;VIEW.playId=S.inst[0].id;VIEW.screen="play";renderAll();return true},
  pluck(i){if(VIEW.screen!=="play"||!VIEW._doPluck)return false;VIEW._doPluck(i);return true},
  toggleAuto(){const b=[...bodyEl.querySelectorAll("button.btn.pri")].find(x=>/play itself|Stop/.test(x.textContent));if(b){b.click();return true}return false},
  gift(instId){const inst=S.inst.find(i=>i.id===instId);if(!inst)return false;giftInstrument(inst);return true},
  rename(instId,name){const inst=S.inst.find(i=>i.id===instId)||SPECIES.map(founderInstance).find(i=>i.id===instId);if(!inst)return false;inst.custom=name;saveNow(S);return true},
  seedOf(instId){const inst=findParent(instId);return inst?encodeSeed(inst):null},
  importSeed(s){return doImportSeed(s)||false},
  async full(){ // breed two founders, place it, return the resulting id
   this.breedNow("f_harp","f_lyre");
   for(let i=0;i<30;i++){if(VIEW.screen==="reveal")break;await new Promise(r=>setTimeout(r,30))}
   const id=VIEW.pending&&VIEW.pending.id;this.place();
   for(let i=0;i<30;i++){if(VIEW.screen==="lounge")break;await new Promise(r=>setTimeout(r,30))}
   return id;
  }
 };
}
boot();
})();

<script>
/* ===================== FLAGGER: every citizen of Republicka is encouraged to raise their own nation
   rather than surrender their sovereignty to anyone else's — Republicka included. A flag made here is
   that nation's own device: a small, sewable, genuinely flyable banner, never a claim on territory.
   Keep it simple — whatever can't be sewn by hand in an afternoon doesn't belong on the cloth.
   Everything is drawn in code; there are no images or fonts.
   Save: localStorage "tvos_flagger" (one key, merge-with-defaults load). CC0, public domain. ========= */
(()=>{
"use strict";
const host=document.getElementById("tlhost");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SAVE="tvos_flagger";
const TAU=Math.PI*2;

/* a tiny seeded RNG — used only for short id strings, never for the flag's own look. */
function rng(seedStr){let h=1779033703^seedStr.length;for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function rint(r,a,b){return a+Math.floor(r()*(b-a+1))}
const B36="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function shortId(){let s="";for(let i=0;i<6;i++)s+=B36[Math.floor(Math.random()*B36.length)];return s.slice(0,3)+"-"+s.slice(3)}

/* ---- palette: a curated set of flag-true, saturated colors, plus the player can always reach for a
   full color picker. The curated set exists so "pick two and go" is always a strong, legible choice. ---- */
const PALETTE=["#f6ecd8","#1c2440","#b3453c","#d8a53d","#1a6b3c","#13384f","#7a1f3d","#e8702a",
 "#111111","#3a7bd5","#0e6e5e","#6b2d8f","#c9c9c9","#8a5a2b","#2d8fd8","#d84f6b"];

/* ---- layout templates: classic, two-or-three-field vexillology patterns, kept to shapes any sewing
   circle could actually piece together. ---- */
const TEMPLATES=[
 {id:"solid",nm:"Plain field",bands:1,desc:"One color, nothing else. The boldest flag there is."},
 {id:"bh2",nm:"Two bands (across)",bands:2,desc:"Top and bottom, split evenly."},
 {id:"bh3",nm:"Three bands (across)",bands:3,desc:"Three even stripes, stacked."},
 {id:"bv2",nm:"Two bands (up-down)",bands:2,desc:"Hoist and fly, split evenly."},
 {id:"bv3",nm:"Three bands (up-down)",bands:3,desc:"Three even stripes, side by side."},
 {id:"cross",nm:"Offset cross",bands:2,desc:"A cross shifted toward the hoist, Nordic-style."},
 {id:"saltire",nm:"Diagonal cross",bands:2,desc:"A corner-to-corner X."},
 {id:"bend",nm:"Diagonal band",bands:2,desc:"One stripe, corner to corner."},
 {id:"wedge",nm:"Hoist wedge",bands:2,desc:"A triangle driven in from the staff side."},
 {id:"border",nm:"Bordered field",bands:2,desc:"A field with a frame of color around it."},
 {id:"ujfield",nm:"Union Jack (full field)",bands:0,
  desc:"The Union Jack itself, filling the whole flag — not tucked in a corner. Add a charge of your own in the center on top of it."}
];
function tpl(id){return TEMPLATES.find(t=>t.id===id)||TEMPLATES[0]}

/* ---- charges: simple geometric emblems, drawn as flat silhouettes. the two heritage charges are
   fixed-design stamps, not colorable — using one is itself a small act of declared lineage. ---- */
const CHARGES=[
 {id:"none",nm:"No charge",heritage:false},
 {id:"star",nm:"Star",heritage:false},
 {id:"circle",nm:"Disc",heritage:false},
 {id:"triangle",nm:"Triangle",heritage:false},
 {id:"diamond",nm:"Diamond",heritage:false},
 {id:"crescent",nm:"Crescent",heritage:false},
 {id:"cross",nm:"Cross",heritage:false},
 {id:"wave",nm:"Wave",heritage:false},
 {id:"tree",nm:"Tree",heritage:false},
 {id:"unionjack",nm:"Union Jack",heritage:true,desc:"The union of St. George, St. Andrew and St. Patrick — raised here in alliance, not rule."},
 {id:"commonwealthstar",nm:"Commonwealth Star",heritage:true,desc:"Seven points: one for each founding state and territory, federated as equals."}
];
function chg(id){return CHARGES.find(c=>c.id===id)||CHARGES[0]}

const POSITIONS=[{id:"center",nm:"Center"},{id:"canton",nm:"Canton"},{id:"hoist",nm:"Hoist band"}];
const SCALES={small:.26,medium:.38,large:.52};

/* ---- NAVA "Good Flag, Bad Flag" checklist, scored live against the current spec. ---- */
function flagColors(spec){
 const set=new Set();
 const need=tpl(spec.layout).bands;
 (spec.bg||[]).slice(0,need).forEach(c=>c&&set.add(c));
 if(spec.charge&&spec.charge.id!=="none"&&!chg(spec.charge.id).heritage&&spec.charge.color)set.add(spec.charge.color);
 return Array.from(set)}
function navaCheck(spec){
 const colors=flagColors(spec);
 return [
  {id:"simple",ok:true,t:"Keep it simple"},
  {id:"colors",ok:colors.length<=3,t:colors.length<=3?"2–3 basic colors":"too many colors ("+colors.length+")"},
  {id:"nolet",ok:true,t:"No lettering or seals"},
  {id:"meaning",ok:!!(spec.decl&&spec.decl.trim().length>0),t:spec.decl&&spec.decl.trim().length>0?"Carries a declaration":"no declaration yet"}
 ]}

/* ---- seed codec: a flag's whole look (never its declaration or its name) packed into a short,
   shareable, URL-safe string. anyone can type it in and raise the same nation's colors themselves. ---- */
function defaultSpec(){
 return {layout:"solid",bg:["#1c2440","#1c2440","#1c2440"],charge:{id:"none",color:"#d8a53d",pos:"center",scale:"medium"},decl:""}}
function encodeSeed(spec){
 const c=spec.charge||{id:"none"};
 const compact={l:spec.layout,b:spec.bg,c:c.id,cc:c.color,cp:c.pos,cs:c.scale};
 try{
  const json=JSON.stringify(compact);
  const b64=btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "FLAG1-"+b64;
 }catch(e){return null}}
function decodeSeed(seed){
 try{
  if(!seed)return null;
  seed=seed.trim();
  const m=seed.match(/^FLAG1-(.+)$/);
  const b64=(m?m[1]:seed).replace(/-/g,"+").replace(/_/g,"/");
  const pad=b64.length%4?"=".repeat(4-b64.length%4):"";
  const json=decodeURIComponent(escape(atob(b64+pad)));
  const c=JSON.parse(json);
  if(!c||!c.l)return null;
  const t=tpl(c.l);
  let bg=Array.isArray(c.b)?c.b.slice(0,3):["#1c2440","#1c2440","#1c2440"];
  while(bg.length<3)bg.push(bg[bg.length-1]||"#1c2440");
  return {layout:t.id,bg,charge:{id:chg(c.c).id,color:c.cc||"#d8a53d",pos:c.cp||"center",scale:c.cs||"medium"},decl:""};
 }catch(e){return null}}
/* ===================== drawing: the flag itself, and its charges. nothing here is an image —
   it is all canvas paths, so any flag made here could genuinely be cut and pieced in cloth. ====== */

function drawFlag(c,spec,x,y,w,h){
 c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
 const bg=spec.bg||["#1c2440","#1c2440","#1c2440"];
 const t=tpl(spec.layout);
 if(t.id==="ujfield"){
  drawUnionJack(c,x,y,w,h);
  c.restore();
  if(spec.charge&&spec.charge.id!=="none")drawCharge(c,spec.charge,x,y,w,h);
  return;
 }
 c.fillStyle=bg[0];c.fillRect(x,y,w,h);
 if(t.id==="bh2"){
  c.fillStyle=bg[1];c.fillRect(x,y+h/2,w,h/2);
 }else if(t.id==="bh3"){
  c.fillStyle=bg[1];c.fillRect(x,y+h/3,w,h/3);
  c.fillStyle=bg[2];c.fillRect(x,y+h*2/3,w,h/3);
 }else if(t.id==="bv2"){
  c.fillStyle=bg[1];c.fillRect(x+w/2,y,w/2,h);
 }else if(t.id==="bv3"){
  c.fillStyle=bg[1];c.fillRect(x+w/3,y,w/3,h);
  c.fillStyle=bg[2];c.fillRect(x+w*2/3,y,w/3,h);
 }else if(t.id==="cross"){
  c.fillStyle=bg[1];
  const vx=x+w*.33,vb=h*.22,hb=h*.22;
  c.fillRect(vx-vb/2,y,vb,h);
  c.fillRect(x,y+h/2-hb/2,w,hb);
 }else if(t.id==="saltire"){
  c.strokeStyle=bg[1];c.lineWidth=h*.22;c.lineCap="butt";
  c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y+h);c.moveTo(x+w,y);c.lineTo(x,y+h);c.stroke();
 }else if(t.id==="bend"){
  c.strokeStyle=bg[1];c.lineWidth=h*.4;c.lineCap="butt";
  c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y+h);c.stroke();
 }else if(t.id==="wedge"){
  c.fillStyle=bg[1];c.fillRect(x,y,w,h);
  c.fillStyle=bg[0];
  c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.lineTo(x+w*.45,y+h/2);c.closePath();c.fill();
 }else if(t.id==="border"){
  c.fillStyle=bg[1];c.fillRect(x,y,w,h);
  const ins=h*.14;
  c.fillStyle=bg[0];c.fillRect(x+ins,y+ins,w-ins*2,h-ins*2);
 }
 c.restore();
 if(spec.charge&&spec.charge.id!=="none")drawCharge(c,spec.charge,x,y,w,h);
}

function chargeBox(pos,x,y,w,h){
 if(pos==="canton")return{x:x,y:y,w:w*.42,h:h*.5,cx:x+w*.21,cy:y+h*.25};
 if(pos==="hoist")return{x:x,y:y,w:w*.34,h:h,cx:x+w*.17,cy:y+h/2};
 return{x:x,y:y,w:w,h:h,cx:x+w/2,cy:y+h/2};
}

function drawCharge(c,ch,x,y,w,h){
 const def=chgDef(ch.id);
 const box=chargeBox(ch.pos,x,y,w,h);
 if(ch.id==="unionjack"){
  if(ch.pos==="canton")drawUnionJack(c,box.x,box.y,box.w,box.h);
  else{const bw=Math.min(box.w,h*(SCALES[ch.scale]||.38)*2),bh=bw/2;drawUnionJack(c,box.cx-bw/2,box.cy-bh/2,bw,bh)}
  return}
 if(ch.id==="commonwealthstar"){
  const r=ch.pos==="canton"?Math.min(box.w,box.h)*.38:h*(SCALES[ch.scale]||.38)*.5;
  drawCommonwealthStar(c,box.cx,box.cy,r);
  return}
 const r=(ch.pos==="canton"?Math.min(box.w,box.h)*.38:h*(SCALES[ch.scale]||.38)*.5);
 const col=ch.color||"#d8a53d";
 c.fillStyle=col;c.strokeStyle=col;
 drawGenericCharge(c,ch.id,box.cx,box.cy,r,col);
}

function drawGenericCharge(c,id,cx,cy,r,col){
 if(id==="star"){polyStar(c,cx,cy,r,r*.42,5);c.fillStyle=col;c.fill();return}
 if(id==="circle"){c.beginPath();c.arc(cx,cy,r,0,TAU);c.fillStyle=col;c.fill();return}
 if(id==="triangle"){
  c.beginPath();c.moveTo(cx,cy-r);c.lineTo(cx+r*.87,cy+r*.6);c.lineTo(cx-r*.87,cy+r*.6);c.closePath();
  c.fillStyle=col;c.fill();return}
 if(id==="diamond"){
  c.beginPath();c.moveTo(cx,cy-r);c.lineTo(cx+r*.72,cy);c.lineTo(cx,cy+r);c.lineTo(cx-r*.72,cy);c.closePath();
  c.fillStyle=col;c.fill();return}
 if(id==="crescent"){
  c.save();
  c.beginPath();c.arc(cx,cy,r,0,TAU);c.fillStyle=col;c.fill();
  c.globalCompositeOperation="destination-out";
  c.beginPath();c.arc(cx+r*.45,cy-r*.12,r*.84,0,TAU);c.fill();
  c.restore();return}
 if(id==="cross"){
  const bw=r*.42;
  c.fillStyle=col;
  c.fillRect(cx-bw/2,cy-r,bw,r*2);
  c.fillRect(cx-r,cy-bw/2,r*2,bw);
  return}
 if(id==="wave"){
  c.beginPath();
  const steps=24;
  for(let i=0;i<=steps;i++){const px=cx-r+2*r*i/steps,py=cy+Math.sin(i/steps*Math.PI*2)*r*.3;
   i===0?c.moveTo(px,py-r*.18):c.lineTo(px,py-r*.18)}
  for(let i=steps;i>=0;i--){const px=cx-r+2*r*i/steps,py=cy+Math.sin(i/steps*Math.PI*2)*r*.3;
   c.lineTo(px,py+r*.18)}
  c.closePath();c.fillStyle=col;c.fill();return}
 if(id==="tree"){
  c.fillStyle=col;
  c.beginPath();c.moveTo(cx,cy-r);c.lineTo(cx+r*.62,cy-r*.1);c.lineTo(cx+r*.3,cy-r*.1);c.lineTo(cx+r*.78,cy+r*.5);c.lineTo(cx+r*.22,cy+r*.5);c.lineTo(cx+r*.22,cy+r*.85);c.lineTo(cx-r*.22,cy+r*.85);c.lineTo(cx-r*.22,cy+r*.5);c.lineTo(cx-r*.78,cy+r*.5);c.lineTo(cx-r*.3,cy-r*.1);c.lineTo(cx-r*.62,cy-r*.1);c.closePath();c.fill();return}
}

function polyStar(c,cx,cy,rOuter,rInner,points){
 c.beginPath();
 for(let i=0;i<points*2;i++){
  const r=i%2===0?rOuter:rInner;
  const ang=-Math.PI/2+i*Math.PI/points;
  const px=cx+Math.cos(ang)*r,py=cy+Math.sin(ang)*r;
  i===0?c.moveTo(px,py):c.lineTo(px,py)}
 c.closePath()}

function drawCommonwealthStar(c,cx,cy,r){
 polyStar(c,cx,cy,r,r*.46,7);
 c.fillStyle="#ffffff";c.fill();
 c.lineWidth=Math.max(1,r*.05);c.strokeStyle="rgba(10,20,40,.55)";c.stroke()}

function drawUnionJack(c,x,y,w,h){
 c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
 c.fillStyle="#00247d";c.fillRect(x,y,w,h);
 const cx=x+w/2,cy=y+h/2;
 c.lineCap="butt";
 c.strokeStyle="#ffffff";c.lineWidth=h*.3;
 c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y+h);c.moveTo(x+w,y);c.lineTo(x,y+h);c.stroke();
 c.strokeStyle="#cf142b";c.lineWidth=h*.11;
 c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y+h);c.moveTo(x+w,y);c.lineTo(x,y+h);c.stroke();
 c.strokeStyle="#ffffff";c.lineWidth=h*.34;
 c.beginPath();c.moveTo(x,cy);c.lineTo(x+w,cy);c.moveTo(cx,y);c.lineTo(cx,y+h);c.stroke();
 c.strokeStyle="#cf142b";c.lineWidth=h*.16;
 c.beginPath();c.moveTo(x,cy);c.lineTo(x+w,cy);c.moveTo(cx,y);c.lineTo(cx,y+h);c.stroke();
 c.restore()}

function chgDef(id){return chg(id)}
/* ===================== state & rules ===================== */
const DEF=()=>({v:1,flags:[],nation:null});
let G=DEF();
function gload(){try{const s=JSON.parse(localStorage.getItem(SAVE)||"null");if(s)G=Object.assign(DEF(),s)}catch(e){G=DEF()}}
function gsave(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}

/* FS: the flag currently on the bench — a working copy, not yet saved. */
let FS={editing:null,spec:null};

function newFlagEditor(){FS={editing:null,spec:defaultSpec()}}
function editFlagEditor(id){
 const f=G.flags.find(x=>x.id===id);
 if(!f){newFlagEditor();return}
 FS={editing:id,spec:JSON.parse(JSON.stringify(f.spec))}}
function loadSpecIntoEditor(spec){FS={editing:null,spec:Object.assign(defaultSpec(),spec,{decl:""})}}

function findFlag(id){return G.flags.find(f=>f.id===id)}

function commitSave(){
 if(!FS.spec)return null;
 const seed=encodeSeed(FS.spec);
 if(FS.editing){
  const f=findFlag(FS.editing);
  if(f){f.spec=JSON.parse(JSON.stringify(FS.spec));f.seed=seed;f.ts=Date.now();gsave();return f}
 }
 const f={id:shortId(),label:"Nation "+Math.floor(Math.random()*900+100),spec:JSON.parse(JSON.stringify(FS.spec)),seed,ts:Date.now()};
 G.flags.unshift(f);
 if(!G.nation)G.nation=f.id;
 FS.editing=f.id;
 gsave();
 return f}

function deleteFlag(id){
 G.flags=G.flags.filter(f=>f.id!==id);
 if(G.nation===id)G.nation=G.flags.length?G.flags[0].id:null;
 gsave()}

function setNation(id){if(findFlag(id)){G.nation=id;gsave()}}
/* ===================== rendering: paints a flag spec onto any canvas element at its own
   resolution. flags are always drawn fresh from the spec — nothing is cached as a picture. */
function paintFlagTo(cnv,spec){
 if(!cnv||!spec)return;
 const c=cnv.getContext("2d");
 c.clearRect(0,0,cnv.width,cnv.height);
 drawFlag(c,spec,0,0,cnv.width,cnv.height)}

function renderNava(){
 const rows=navaCheck(FS.spec);
 $("nava").innerHTML=rows.map(r=>'<span class="chip '+(r.ok?"ok":"bad")+'">'+(r.ok?"&#10003; ":"&#9888; ")+esc(r.t)+'</span>').join("")}

function renderBench(){
 paintFlagTo($("cv"),FS.spec);
 paintFlagTo($("favcv"),FS.spec);
 renderNava()}
/* ===================== UI chrome, flow, modal, export ===================== */
let VIEW="lounge";
let TOASTT=null,LASTTOAST="";
function toast(t){if(t===LASTTOAST)return;LASTTOAST=t;const el=$("toast");el.textContent=t;el.classList.add("show");
 clearTimeout(TOASTT);TOASTT=setTimeout(()=>el.classList.remove("show"),1800)}
function showModal(html){$("modalbox").innerHTML=html;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}

function setView(v){closeModal();VIEW=v;document.querySelectorAll("section.scr").forEach(s=>s.classList.toggle("on",s.id===v));
 if(v==="lounge")renderLounge();
 else if(v==="bench"){
  $("decl").value=FS.spec.decl||"";
  $("declcnt").textContent=(FS.spec.decl||"").length+" / 140";
  $("benchttl").textContent=FS.editing?"Editing "+((findFlag(FS.editing)||{}).label||"a nation's flag"):"Stitching a new flag";
  renderCtl();renderBench()}}

/* ===================== lounge ===================== */
function renderLounge(){
 const nf=G.nation?findFlag(G.nation):null;
 $("lhead").innerHTML=
  '<div class="nflag'+(nf?"":" empty")+'">'+(nf?'<canvas id="nbanner" width="520" height="260"></canvas>':"No nation flown yet — stitch your first flag below.")+'</div>'+
  '<div><h1 class="ltitle">'+(nf?esc(nf.label):"Flagger")+'</h1>'+
  '<p class="lsub">A sewing bench for small, sovereign flags — one per nation, and every player their own nation.</p>'+
  (nf&&nf.spec.decl?'<p class="ndecl">&#8220;'+esc(nf.spec.decl)+'&#8221;</p>':"")+
  '</div>';
 if(nf)paintFlagTo($("nbanner"),nf.spec);
 $("lstatus").innerHTML=G.flags.length?
  "<b>"+G.flags.length+" nation"+(G.flags.length===1?"":"s")+"</b> raised so far. Fly one on your own website — even as its favicon — and it's truly flying.":
  "A clean length of cloth, a needle, and as many colors as you can keep simple. Every flag you make here is a nation of one — sovereign, not lonely, allied by choice.";

function renderShelf(){
 if(!G.flags.length){$("shelf").innerHTML='<div class="empty-note">Nothing on the shelf yet. Stitch a new flag to begin.</div>';return}
 $("shelf").innerHTML=G.flags.map(f=>
  '<div class="scard"><canvas data-th="'+f.id+'" width="300" height="150"></canvas>'+
  '<div class="nm">'+esc(f.label)+(G.nation===f.id?' <span class="ac">&#9733; nation</span>':"")+'</div>'+
  '<div class="dc">'+(f.spec.decl?esc(f.spec.decl):"<span class=\"dim\">no declaration</span>")+'</div>'+
  '<div class="row">'+
   '<button class="b sm" data-a="editflag" data-k="'+f.id+'">Edit</button>'+
   (G.nation===f.id?"":'<button class="b sm" data-a="setnation" data-k="'+f.id+'">Set as nation</button>')+
   '<button class="b sm" data-a="exportflag" data-k="'+f.id+'">Export</button>'+
   '<button class="b sm" data-a="askdelete" data-k="'+f.id+'">Delete</button>'+
  '</div></div>').join("");
 G.flags.forEach(f=>paintFlagTo(document.querySelector('[data-th="'+f.id+'"]'),f.spec))}

/* ===================== bench / editor controls ===================== */
function renderCtl(){
 const spec=FS.spec,t=tpl(spec.layout);
 let h='<h4>Layout</h4><div class="grid3">'+TEMPLATES.map(tp=>
  '<div class="tbtn'+(spec.layout===tp.id?" on":"")+'" data-a="layout" data-k="'+tp.id+'" title="'+esc(tp.desc)+'">'+
  '<canvas width="80" height="40" data-tpv="'+tp.id+'"></canvas><span>'+esc(tp.nm)+'</span></div>').join("")+'</div>';
 h+='<h4>Colors</h4>';
 for(let i=0;i<t.bands;i++)h+=colorSlotHtml(i,spec.bg[i]);
 h+='<h4>Charge</h4><div class="grid4">'+CHARGES.map(c=>
  '<div class="tbtn'+(spec.charge.id===c.id?" on":"")+'" data-a="charge" data-k="'+c.id+'" title="'+esc(c.desc||c.nm)+'">'+
  '<canvas width="56" height="28" data-chv="'+c.id+'"></canvas><span>'+esc(c.nm)+'</span></div>').join("")+'</div>';
 if(spec.charge.id!=="none"){
  const heritage=chg(spec.charge.id).heritage;
  if(!heritage)h+='<h4>Charge color</h4>'+colorSlotHtml("charge",spec.charge.color);
  h+='<h4>Position</h4><div class="grid3">'+POSITIONS.map(p=>
   '<button class="b sm'+(spec.charge.pos===p.id?" on":"")+'" data-a="pos" data-k="'+p.id+'">'+p.nm+'</button>').join("")+'</div>';
  h+='<h4>Size</h4><div class="grid3">'+Object.keys(SCALES).map(s=>
   '<button class="b sm'+(spec.charge.scale===s?" on":"")+'" data-a="scale" data-k="'+s+'">'+s+'</button>').join("")+'</div>';
 }
 h+='<h4>Export</h4><div class="grid3">'+
  '<button class="b sm" data-a="exportpng">Flag PNG</button>'+
  '<button class="b sm" data-a="exportfav">Favicon</button>'+
  '<button class="b sm" data-a="copyseed">Copy seed</button></div>';
 const seed=encodeSeed(spec)||"";
 h+='<div class="seedbox"><input id="seedout" readonly value="'+esc(seed)+'"></div>';
 $("ctl").innerHTML=h;
 TEMPLATES.forEach(tp=>paintFlagTo(document.querySelector('[data-tpv="'+tp.id+'"]'),{layout:tp.id,bg:["#3a7bd5","#f6ecd8","#1c2440"],charge:{id:"none"}}));
 CHARGES.forEach(c=>{
  const cv=document.querySelector('[data-chv="'+c.id+'"]');if(!cv)return;
  if(c.id==="none"){const ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle="rgba(255,255,255,.25)";ctx.strokeRect(6,6,cv.width-12,cv.height-12);return}
  paintFlagTo(cv,{layout:"solid",bg:["#1c2440","#1c2440","#1c2440"],charge:{id:c.id,color:"#d8a53d",pos:"center",scale:"large"}})});
 document.querySelectorAll('.cpick[data-slot]').forEach(inp=>{
  inp.addEventListener("input",()=>{setSlotColor(inp.dataset.slot,inp.value)})})}

function colorSlotHtml(slot,val){
 return '<div class="slot"><input type="color" class="cpick" data-slot="'+slot+'" value="'+val+'">'+
  '<div class="lb">'+(slot==="charge"?"charge color":"band "+(+slot+1))+'</div></div>'+
  '<div class="grid4" style="margin-bottom:10px">'+PALETTE.map(p=>
   '<div class="swatch'+(val===p?" on":"")+'" style="background:'+p+'" data-a="pickcolor" data-k="'+slot+'" data-t="'+p+'"></div>').join("")+'</div>'}

function setSlotColor(slot,val){
 if(slot==="charge")FS.spec.charge.color=val;else FS.spec.bg[slot]=val;
 renderBench();renderCtl()}

/* ===================== central dispatcher ===================== */
function act(a,k,t){
 if(a==="lounge"){setView("lounge");return}
 if(a==="newflag"){newFlagEditor();setView("bench");return}
 if(a==="editflag"){editFlagEditor(k);setView("bench");return}
 if(a==="save"){const f=commitSave();if(f){toast("Raised "+f.label+".");renderCtl();$("benchttl").textContent="Editing "+f.label}return}
 if(a==="setnation"){setNation(k);renderLounge();toast("Nation flag set.");return}
 if(a==="askdelete"){
  const f=findFlag(k);if(!f)return;
  showModal('<h3>Take this one down?</h3><p>'+esc(f.label)+' will come off the shelf for good.</p>'+
   '<button class="b pri" data-a="confirmdelete" data-k="'+k+'">Take it down</button> <button class="b" data-a="x">Keep it</button>');
  return}
 if(a==="confirmdelete"){deleteFlag(k);closeModal();if(VIEW==="lounge")renderLounge();toast("Taken down.");return}
 if(a==="x"){closeModal();return}
 if(a==="layout"){FS.spec.layout=k;const need=tpl(k).bands;while(FS.spec.bg.length<need)FS.spec.bg.push(PALETTE[0]);renderBench();renderCtl();return}
 if(a==="pickcolor"){setSlotColor(k,t);return}
 if(a==="charge"){
  FS.spec.charge.id=k;
  if(k==="unionjack")FS.spec.charge.pos="canton";
  if(!FS.spec.charge.color)FS.spec.charge.color=PALETTE[3];
  renderBench();renderCtl();return}
 if(a==="pos"){FS.spec.charge.pos=k;renderBench();renderCtl();return}
 if(a==="scale"){FS.spec.charge.scale=k;renderBench();return}
 if(a==="exportpng"){exportPNG(FS.spec,(FS.editing&&findFlag(FS.editing)?findFlag(FS.editing).label:"flag"));return}
 if(a==="exportfav"){exportFavicon(FS.spec,(FS.editing&&findFlag(FS.editing)?findFlag(FS.editing).label:"flag"));return}
 if(a==="exportflag"){const f=findFlag(k);if(f)exportPNG(f.spec,f.label);return}
 if(a==="copyseed"){
  const inp=$("seedout");if(!inp)return;
  inp.select();
  try{navigator.clipboard&&navigator.clipboard.writeText(inp.value);toast("Seed copied.")}
  catch(e){try{document.execCommand("copy");toast("Seed copied.")}catch(e2){toast("Copy it from the box.")}}
  return}
 if(a==="loadseed"){
  showModal('<h3>Load a seed</h3><p class="dim">Paste a flag seed someone shared with you to raise it here — then make it your own.</p>'+
   '<div class="seedbox"><input id="seedin" placeholder="FLAG1-..."></div><br>'+
   '<button class="b pri" data-a="doloadseed">Raise it</button> <button class="b" data-a="x">Cancel</button>');
  return}
 if(a==="doloadseed"){
  const val=($("seedin")||{}).value||"";
  const spec=decodeSeed(val);
  if(!spec){toast("That seed doesn't look right.");return}
  loadSpecIntoEditor(spec);closeModal();setView("bench");toast("Raised. Make it yours, then save it.");
  return}
 if(a==="howto"){
  showModal('<h3>How this works</h3>'+
   '<p>Every flag you stitch here is its own small, sovereign nation — not a claim on land, just a device for one person (or a few, by choice) to fly. Republicka works the same way: you\'re encouraged to raise your own nation rather than hand your autonomy to anyone else\'s, Republicka included. A citizen is just someone who likes what another nation is doing enough to fly a little of it too.</p>'+
   '<p>Keep it simple — a flag with too many colors or too fine a shape is hard to sew and harder to recognize at a glance. There\'s no lettering tool on purpose: say what the flag means with a spoken declaration instead, not stitching.</p>'+
   '<p>Once you\'re happy, save it. You\'ll get a short seed — share it, and anyone can raise the same colors on their own screen. Export it as a PNG, or as a favicon for your own website: that\'s the truest way to actually fly it.</p>'+
   '<p>The Union Jack and the Commonwealth Star are here as heritage charges — Republicka\'s own flag is simply the one with the other in its canton. Use them if your nation is allied to that lineage; leave them off if it isn\'t.</p>'+
   '<button class="b pri" data-a="x">Got it</button>');
  return}
}
host.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;act(b.dataset.a,b.dataset.k,b.dataset.t)});
$("decl").addEventListener("input",()=>{
 FS.spec.decl=$("decl").value.slice(0,140);
 $("declcnt").textContent=FS.spec.decl.length+" / 140";
 renderNava()});

/* ===================== export: PNG + a minimal hand-rolled ICO ===================== */
function downloadBlob(blob,filename){
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();
 setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},200)}
function slug(s){return (s||"flag").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"flag"}
function exportPNG(spec,label){
 const cv=document.createElement("canvas");cv.width=1200;cv.height=600;
 paintFlagTo(cv,spec);
 cv.toBlob(b=>{if(b)downloadBlob(b,slug(label)+".png");else toast("Export failed.")},"image/png")}
function exportFavicon(spec,label){
 const cv=document.createElement("canvas");cv.width=32;cv.height=32;
 paintFlagTo(cv,spec);
 cv.toBlob(b=>{if(b)downloadBlob(b,"favicon-"+slug(label)+".png")},"image/png");
 cv.toBlob(b=>{
  if(!b){toast("Export failed.");return}
  const r=new FileReader();
  r.onload=()=>{try{const ico=pngToIco(new Uint8Array(r.result));downloadBlob(new Blob([ico],{type:"image/x-icon"}),"favicon.ico")}catch(e){}};
  r.readAsArrayBuffer(b)},"image/png")}
/* a .ico file can simply contain one embedded PNG image — every modern browser and OS
   accepts that. this wraps the 32x32 PNG bytes in the minimal ICO container format. */
function pngToIco(pngBytes){
 const n=pngBytes.length;
 const header=new Uint8Array(6+16);
 const dv=new DataView(header.buffer);
 dv.setUint16(0,0,true);dv.setUint16(2,1,true);dv.setUint16(4,1,true); // reserved, type=icon, count=1
 header[6]=32;header[7]=32; // width,height (0 means 256, we use 32 so literal 32)
 header[8]=0;header[9]=0;   // color palette
 dv.setUint16(10,1,true);   // color planes
 dv.setUint16(12,32,true);  // bits per pixel
 dv.setUint32(14,n,true);   // size of image data
 dv.setUint32(18,22,true);  // offset to image data
 const out=new Uint8Array(22+n);
 out.set(header,0);out.set(pngBytes,22);
 return out}

/* ===================== RT: test hooks ===================== */
const RT={
 G:()=>G,FS:()=>FS,
 newFlag:()=>newFlagEditor(),
 editFlag:id=>editFlagEditor(id),
 setSpec:patch=>{Object.assign(FS.spec,patch);renderBench&&VIEW==="bench"&&renderBench()},
 setBg:(i,c)=>{FS.spec.bg[i]=c},
 setCharge:(id,color,pos,scale)=>{FS.spec.charge.id=id;if(color)FS.spec.charge.color=color;if(pos)FS.spec.charge.pos=pos;if(scale)FS.spec.charge.scale=scale},
 setDecl:t=>{FS.spec.decl=t},
 save:()=>commitSave(),
 deleteFlag:id=>deleteFlag(id),
 setNation:id=>setNation(id),
 flags:()=>G.flags,
 encodeSeed:spec=>encodeSeed(spec||FS.spec),
 decodeSeed:s=>decodeSeed(s),
 loadSeed:s=>{const sp=decodeSeed(s);if(sp){loadSpecIntoEditor(sp);return true}return false},
 act:(a,k,t)=>act(a,k,t),
 setView:v=>setView(v),
 nava:()=>navaCheck(FS.spec)
};
host.RT=RT;

function boot(){gload();if(!FS.spec)newFlagEditor();setView("lounge")}
boot();
})();

const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(k==="html")e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}for(const k of kids.flat(Infinity))if(k!=null)e.append(k.nodeType?k:document.createTextNode(k));return e};

function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const DIMN=5;
const vec=(w,i,m,p,d)=>[w,i,m,p,d];
const vdist2=(a,b)=>{let s=0;for(let k=0;k<DIMN;k++){const d=a[k]-b[k];s+=d*d}return s};

const VERBS=[/* what you DO */

function pickWord(bank,target,rnd,avoid){
 const scored=bank.map(([w,v])=>({w,d:vdist2(v,target)})).sort((a,b)=>a.d-b.d);
 const pool=scored.slice(0,5).filter(e=>!avoid||!avoid.has(e.w));
 const use=pool.length?pool:scored.slice(0,5);
 // weighted toward closer matches
 const weights=use.map((e,i)=>1/(i+1));
 const tot=weights.reduce((a,b)=>a+b,0);let r=rnd()*tot;
 for(let i=0;i<use.length;i++){r-=weights[i];if(r<=0)return use[i].w}
 return use[0].w;
}
function graftName(target,rnd){
 const adj=pickWord(ADJ,target,rnd);
 const noun=pickWord(NOUN,target,rnd,new Set([adj]));
 return adj+" "+noun;
}

/* ================= SPARK SCORING (see note below) =================
 Three ingredients go into a grafted game's Spark score, and none of them
 is a hidden multiplier on the others - they're added, so each is legible
 on its own:
   1) BASE  - how different the two parents' traits are. Two very similar
      parents make a near-duplicate child (the "breeding a thing with
      itself teaches you nothing new" rule) and score low; two genuinely
      different parents make something worth looking at.
   2) PERF  - the rhythm pass becomes a third trait, not a grade. It is
      scored by how it sits next to the parent pairing: a little
      friction or a little harmony both read as "interesting"; dead-on
      identical or wildly unrelated read as flat.
   3) NOVELTY - a bonus for a verb+feel combination nobody has grafted
      before, which decays the more times you re-graft the exact same
      pair of parents (so the game rewards trying new combinations).
================================================================== */
function computeSpark(verbVec,feelVec,perfVec,isDupe,pairRepeatCount){
 const d_vf=Math.sqrt(vdist2(verbVec,feelVec));
 let base=clamp(10+d_vf*3,10,60);
 if(isDupe)base*=.35;
 const mid=vmix([[verbVec,1],[feelVec,1]]);
 const d_pf=Math.sqrt(vdist2(perfVec,mid));
 const perfScore=clamp(30-Math.abs(d_pf-6)*4,6,30);
 const novelty=pairRepeatCount===0?15:clamp(15-pairRepeatCount*5,0,15);
 const wobble=(rnd()*6)-3;
 return clamp(Math.round(base+perfScore+novelty+wobble),1,100);
}

function graftChild(parentA,parentB,verbWord,feelWord,accuracy){
 // verbWord/feelWord are resolved once, back in the Mold step (see resolveTraits below), and threaded
 // through here unchanged - so the shape a kid watched form in the mold is the shape they actually get.
 const perfEntry=perfFromAccuracy(accuracy);
 const perfWord=perfEntry[0], perfVec=perfEntry[1];
 const verbVec=VERBS.find(v=>v[0]===verbWord)[1], feelVec=FEELS.find(f=>f[0]===feelWord)[1];
 const target=vmix([[verbVec,1],[feelVec,1],[perfVec,.6]]);
 const name=graftName(target,rnd), desc=graftDesc(verbWord,feelWord,rnd);
 const isDupe=parentA.id===parentB.id;
 const pk=pairKey(parentA.id,parentB.id);
 const repeatCount=S.pairCounts[pk]||0;
 const spark=computeSpark(verbVec,feelVec,perfVec,isDupe,repeatCount);
 S.pairCounts[pk]=repeatCount+1;
 const dKey=verbWord+"|"+feelWord;
 const firstEver=!S.discoveries.some(d=>d.key===dKey);
 if(firstEver)S.discoveries.unshift({key:dKey,name,verb:verbWord,feel:feelWord,at:Date.now()});
 const gen=Math.max(parentA.gen,parentB.gen)+1;
 const child={id:uid(),name,desc,verb:verbWord,feel:feelWord,perf:perfWord,spark,iseed:freshSeed(),
  gen,parents:[parentA.id,parentB.id],fame:false,born:Date.now()};
 return{child,firstEver};
}
/* Picks among the few nearest words rather than the single strict-nearest one. A hard argmin here
   collapses the whole shelf toward one "centroid" word after a few generations of repeated blending
   (breeding is an averaging process, and averages drift toward the middle of the trait space) - a
   weighted pick among the top matches keeps genuine variety alive across many generations. */
function resolveTrait(bank,target,rnd){
 const scored=bank.map(([w,v])=>({w,d:vdist2(v,target)})).sort((a,b)=>a.d-b.d);
 const pool=scored.slice(0,3);
 const weights=pool.map((e,i)=>1/(i+1));
 const tot=weights.reduce((a,b)=>a+b,0);let r=rnd()*tot;
 for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i].w}
 return pool[0].w;
}
function resolveTraits(parentA,parentB,blueprintWeight,rnd){
 const vA=VERBS.find(v=>v[0]===parentA.verb)[1], vB=VERBS.find(v=>v[0]===parentB.verb)[1];
 const fA=FEELS.find(f=>f[0]===parentA.feel)[1], fB=FEELS.find(f=>f[0]===parentB.feel)[1];
 // blueprintWeight in [0,1]: 0 = lean fully on parent A's "what you do" + B's "what it feels like" (classic split),
 // 1 = lean fully on parent B's "what you do" + A's "what it feels like". .5 = balanced blend of both verbs/feels.
 const verbBlend=vmix([[vA,1-blueprintWeight],[vB,blueprintWeight]]);
 const feelBlend=vmix([[fB,1-blueprintWeight],[fA,blueprintWeight]]);
 return{verbWord:resolveTrait(VERBS,verbBlend,rnd),feelWord:resolveTrait(FEELS,feelBlend,rnd)};
}

 S.shelf.push(child);

function refreshFame(){
 const all=S.shelf.concat(S.archive);
 const top=all.slice().sort((a,b)=>b.spark-a.spark).slice(0,6);
 const topIds=new Set(top.map(g=>g.id));
 for(const g of all)g.fame=topIds.has(g.id);
}

 for(const g of sorted){ (keep.length<SHELF_CAP-4||g.fame)?keep.push(g):spill.push(g) }
 S.shelf=keep;S.archive=S.archive.concat(spill);
}

let actx=null;
function ensureCtx(){if(!actx){const AC=window.AudioContext||window.webkitAudioContext;actx=new AC()}if(actx.state==="suspended")actx.resume();return actx}
function chipTone(sr,freq,secs,seed){
 const n=Math.max(8,Math.floor(sr*secs));const buf=new Float32Array(n);
 const r=mulberry32(seed>>>0);const duty=.35+r()*.3;
 const atk=Math.floor(sr*.004),rel=Math.floor(sr*Math.min(secs*.7,.09));
 for(let i=0;i<n;i++){
  const ph=(i*freq/sr)%1;
  let s=ph<duty?1:-1;
  let env=1;
  if(i<atk)env=i/atk; else if(i>n-rel)env=Math.max(0,(n-i)/rel);
  buf[i]=s*env*.5;
 }
 return buf;
}
const toneCache=new Map();
function getToneBuffer(ctx,freq,secs,seed){
 const key=Math.round(freq)+"_"+Math.round(secs*1000)+"_"+seed;
 let b=toneCache.get(key);
 if(!b){const raw=chipTone(ctx.sampleRate,freq,secs,seed);b=ctx.createBuffer(1,raw.length,ctx.sampleRate);b.copyToChannel(raw,0);toneCache.set(key,b)}
 return b;
}
function degFreq(root,degree,scaleArr){
 const L=scaleArr.length,oct=Math.floor(degree/L),st=scaleArr[((degree%L)+L)%L]+oct*12;
 return root*Math.pow(2,st/12);
}
/* fixed, seeded melodic chart: generated once, not streamed - a kid can learn it within one playthrough */
function buildChart(moodName,seed,noteCount){
 const mood=MOOD[moodName]||MOOD.Cozy, scale=SCALES[mood.scale];
 const r=mulberry32(seed>>>0);
 const beat=60/mood.bpm;
 const notes=[];let t=.6,deg=Math.floor(scale.length*.4)+mood.oct*scale.length;
 for(let i=0;i<noteCount;i++){
  const step=[-2,-1,-1,0,0,1,1,2][Math.floor(r()*8)];
  deg=clamp(deg+step,0,scale.length*3-1);
  const gap=[1,1,1,.5,.5,2][Math.floor(r()*6)];
  const freq=degFreq(mood.root,deg,scale);
  notes.push({at:t,freq,dur:beat*.85,seed:Math.floor(r()*1e6)});
  t+=gap*beat;
 }
 return{notes,beat,mood};
}
/* lookahead scheduler: schedules against ctx.currentTime so timing never drifts with frame rate */
function scheduleChart(ctx,chart,t0,master){
 const LOOK=.12,TICK=25;let i=0,timer=null;
 function tick(){
  const now=ctx.currentTime-t0;
  while(i<chart.notes.length&&chart.notes[i].at<now+LOOK){
   const nt=chart.notes[i],when=t0+nt.at;
   const buf=getToneBuffer(ctx,nt.freq,nt.dur,nt.seed);
   const src=ctx.createBufferSource();src.buffer=buf;const g=ctx.createGain();g.gain.value=.9;
   src.connect(g);g.connect(master);src.start(Math.max(ctx.currentTime,when));
   i++;
  }
  if(i<chart.notes.length)timer=setTimeout(tick,TICK);
 }
 tick();
 return{stop(){clearTimeout(timer)}};
}
