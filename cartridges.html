 {id:"stem",n:"Winding stem and crown",side:"b",deps:[],cost:20,role:"The crown is how a hand reaches the machine. Turn it and the stem winds the mainspring; pull it out and it sets the hands. It comes out when you loosen the setting-lever screw beside it.",refl:"The only part made to be touched. Everything else was made to be left alone."},

 gummy:{n:"Dried oil",parts:["cw","tw","fw","esc","pal"],min:1,fix:"clean",see:"Old oil has dried to a brown varnish around the pivot.",sym:["It runs for an hour or two, then just stops.","It ticks weakly, loses time, and is stopped by morning."],ev:["It sat in a drawer for years.","It has not been cleaned since it was made."],why:"Old oil dries to gum, and a gummy train steals the energy before it reaches the balance."},

const ESSAYS=[
 {at:1,t:"A series system",b:["A pocket watch is a chain. The mainspring pushes the barrel, the barrel turns the wheels, the wheels feed the escapement, the escapement releases the balance. Take away any one link and the whole chain stops, however perfect the others are. Engineers call this a series system.","That is the picture of a clockwork universe: everything fitted to everything else, and one failure felt everywhere. It is a powerful picture, and it explains why a hairline crack in a tiny part can silence a watch.","But look at the limit of the picture. A watch cannot mend itself. A cut finger heals; a tree grows around a nail. Kant noticed this in 1790: a living thing is not merely a machine, because a machine only moves, while an organism also forms and repairs itself. So is the world a watch, or something that grows? Both pictures are useful. Neither may be the whole truth."]},
 {at:2,t:"What does broken mean?",b:["Nothing about a brass wheel is broken. A wheel with a worn pivot is just a wheel with a worn pivot. It is only broken against something: the watch it was meant to belong to, running the way it was meant to run.","So “broken” is a word about purpose. That leads to a question that is easy to ask and hard to answer: whose purpose? The maker's? The owner's? The watch's, if a watch can be said to have one?","One view says purposes are only ever human, put into things by us. Another says some purposes are real features of the world, and things can be truly well or badly made. You will meet customers on both sides of this, and none of them is wrong to want what they want."]},
 {at:3,t:"Two ways to fail",b:["A watch can fail by stopping. Or it can fail by being wrong: running, ticking, and showing the wrong hour. The second kind is more dangerous, because nothing seems amiss.","To tell a watch is wrong you need something to compare it to. That is what the timing machine is for: regulating is bringing a watch into agreement with a reference. A watch cannot be wrong all by itself. It can only disagree with something.","Which raises an old question about people and societies. When we say a belief or a custom is wrong, what is our reference? Some say there is a true time that all clocks approximate. Others say there are only clocks, agreeing or not agreeing with each other."]},
 {at:5,t:"The escapement",b:["The mainspring gives a smooth, steady push. A watch needs something else: small, equal steps. The escapement takes a continuous force and lets it out one tick at a time.","The wheel wants to run, and the pallet fork says “not yet.” Then it says “now,” and lets exactly one tooth by. Without that restraint there would be no time to read, only a spring unwinding in a second.","Some good things cannot be forced. Force a mainspring and it snaps; force a stem and it shears. Is that true of people too, and of the better world some of us hope for? Many have thought a good end reached by force stops being good. Others have thought some ends are worth any means. The watch only shows you what force does to a spring."]},
 {at:8,t:"The smallest part",b:["The balance and its hairspring set the rate of the whole watch. The mainspring has the power and the train has the size, but the tiny spiral of the hairspring decides how fast time goes.","It is tempting to say that small things rule. A fairer reading is that every part rules something. The mainspring rules whether it runs; the escapement rules whether it ticks in steps; the hairspring rules how long a step is.","In a society it is the same question: who really sets the pace? The loudest, the largest, or the part that nobody looks at until it stops?"]},
 {at:12,t:"A blueprint waiting",b:["Before a watch exists, something is already settled: what it is for, and roughly how it will work. William Paley used this in 1802: if you found a watch on a heath, you would not suppose it had always been there. It must have had a maker with a purpose.","Plato would say the form of a watch, and Aristotle its final cause, the reason it exists, is part of what makes it that thing. Many people have felt that a goal can pull the work toward it, as if the finished watch were waiting, timeless, to be seen.","Others reply that this is a trick of looking back. David Hume said a watch is a poor model of a universe, and Darwin showed that apparent purpose in living things can arise without a plan. You can hold either view, and you can ask what each one asks of you."]},
 {at:16,t:"Many hands, one idea",b:["John Harrison spent decades in the 1700s on clocks that could keep time at sea, so that ships could find their longitude. In China, Su Song built a great water-driven astronomical clock tower around 1090, with a kind of escapement, centuries earlier. Different hands, different times, the same hard problem.","One view: the idea of a clock was already there, waiting to be found, and it took particular people, with particular patience, to make it visible. The idea needed hands.","Another view: nothing was waiting. People with similar needs and similar materials arrive at similar machines because the problems are the same. Either way, the work was done by someone, in one place, on one day, with one set of tools."]},
 {at:22,t:"Restore or conserve",b:["A collector wants the watch left exactly as it is, with its scratches and its worn parts. A traveller wants it to run on a cold morning with no excuses. A grandchild wants to hear it tick because someone they loved did.","The same watch can be taken apart for all three, and there is no single right answer. You can keep a worn part and honour its history, or replace it and honour its job.","Means are objective: a pivot is worn or it is not. Ends are plural: what the watch is for depends on whose watch it is. A good watchmaker learns to do the repair and the listening."]},
 {at:30,t:"Hidden watches",b:["Somewhere there are watches that stopped long ago, wound once and put in a drawer. They are not broken in any way a stranger could see, and nobody is looking at them. They wait.","Is a thing no one sees still a thing that matters? One answer: value lives in being used and known. Another: the work was real the day it was done, and being found only makes it public. Many makers died before their work was found, and some of it was worth finding.","What nobody can do is force it. A watch cannot be made to tick by shouting at it. It can only be made ready, and then wound."]}];

/* ===================== a very quiet sound, only if you turn it on ===================== */
let AC=null,OUT=null;
function ac(){if(!G.snd)return null;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=1;OUT.connect(AC.destination)}if(AC.state==="suspended")AC.resume()}catch(e){AC=null}return AC}
host.addEventListener("pointerdown",()=>{ac()},true);
/* a short burst of filtered noise: the body of every sound here */
function burst(t,len,f,q,g,f2){const a=AC;const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*len)),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
 const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type="bandpass";fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+len);fl.Q.value=q;const gn=a.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(OUT);s.start(t)}
/* a tiny metallic ring, so a tick sounds like steel and not like static */
function ping(t,f,g,dec){const a=AC,o=a.createOscillator(),gn=a.createGain();o.type="sine";o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(gn);gn.connect(OUT);o.start(t);o.stop(t+dec+.02)}
/* one beat of the escapement: the pallet stone landing on an escape tooth */
function beatAt(t,tock,g){burst(t,.006,tock?3600:3100,1.1,g);burst(t+.0015,.004,tock?6400:5800,2,g*.55);ping(t,tock?4300:3900,g*.18,.018)}
function tick(tock){if(!ac())return;beatAt(AC.currentTime+.01,tock,.09)}
function ratchet(n,gap,g){if(!ac())return;const t0=AC.currentTime+.01;for(let i=0;i<n;i++){const t=t0+i*gap+(Math.random()-.5)*gap*.15;burst(t,.008,2300,1.6,g);ping(t,2900,g*.12,.012)}return t0+n*gap}
function whirr(t,len){if(!ac())return;burst(t,len,2600,1.2,.05,700);for(let i=0;i<24;i++){const u=i/24;burst(t+u*len*.9,.004,2200-u*900,1.5,.05*(1-u))}}
function sfx(k){if(!ac())return;const t=AC.currentTime+.01;
 if(k==="screw"){for(let i=0;i<3;i++)burst(t+i*.05,.02,1500+i*150,3,.035)}
 else if(k==="lift"||k==="place"){burst(t,.012,2600,1.5,.05);ping(t,3400,.012,.03)}
 else if(k==="open"){burst(t,.03,1100,1,.09);burst(t+.02,.05,700,1,.05);ping(t+.01,1800,.02,.12)}
 else if(k==="clean"){burst(t,.9,500,.5,.04,300)}
 else if(k==="hum"){const o=AC.createOscillator(),g=AC.createGain();o.type="sawtooth";o.frequency.value=100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.02,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=400;o.connect(f);f.connect(g);g.connect(OUT);o.start(t);o.stop(t+1.3)}
 else if(k==="letdown"){ratchet(9,.16,.05)}
 else if(k==="spin"){for(let i=0;i<5;i++)burst(t+i*.09,.03,900,.8,.012)}}
/* the ticking: scheduled ahead on the audio clock, so it is steady even when the screen is busy.
   It follows the watch: five beats a second, softer when the swing is weak, limping when it is out of beat, silent when it stops. */
let NEXTT=0,BEATI=0,TICKFROM=0;
setInterval(()=>{if(!AC||!G.snd||document.hidden||view!=="bench"||!RUN||!JB){NEXTT=0;return}const S=sim();if(!(RUN.wound&&S.ticks)){NEXTT=0;return}
 const now=AC.currentTime;if(now<TICKFROM)return;if(NEXTT<now)NEXTT=now+.04;const g=Math.max(.025,Math.min(1,(S.amp-120)/170))*.085,limp=Math.min(.07,S.beat*.011);
 while(NEXTT<now+.25){const odd=BEATI%2;beatAt(NEXTT+(odd?limp:0),odd,g);BEATI++;NEXTT+=S.catch&&BEATI%40>34?.6:.2}},60);
/* ===================== the loop ===================== */
let LASTP=0,LASTT=0;
function loop(now){requestAnimationFrame(loop);if(document.hidden)return;stepTween(now);
 if(view==="bench"&&RUN&&JB){const S=RUN.wound?sim():null,anim=(S&&(S.ticks||S.reach.length))||POWER||TW||(G.guide&&STEP&&STEP.tg);if(DIRTY||anim&&(now-LASTP>(S&&S.ticks||TW?15:32))){LASTP=now;paint(now)}if(TIMING&&now-LASTT>100){LASTT=now;drawTape(now)}}
 else if(view==="lounge"&&now-LASTP>500){LASTP=now;const c=$("lport");if(c&&LJ)portrait(c,LJ)}}
setInterval(()=>{if(!document.hidden&&view==="bench"&&RUN){G.secs=(G.secs||0)+1;if(G.secs%15===0)gsave();if($("tmn"))tmDraw()}},1000);
addEventListener("pagehide",gsave);document.addEventListener("visibilitychange",()=>{if(document.hidden)gsave()});
try{new ResizeObserver(()=>{DIRTY=true;if(view==="lounge"&&LJ)portrait($("lport"),LJ)}).observe(host)}catch(e){}
/* ===================== the test hook (used by the headless play-tester) ===================== */
function tgWorld(tg){const p=tgPos(tg);return p?{x:p.x,y:p.y}:null}
const RT={audio:()=>({ac:!!AC,state:AC&&AC.state,beats:BEATI,t:AC&&AC.currentTime}),G:()=>G,RUN:()=>RUN,JB:()=>JB,nextStep:nextStep,sim:sim,checks:checks,openRun:openRun,setView:setView,act:act,PARTS:PARTS,FAULTS:FAULTS,makeJob:makeJob,newSeed:newSeed,tap:tap,
 step(){const s=nextStep();if(!s)return"done";const m=$("modal");if(m.classList.contains("show")){if($("trc")){while(NUDGE)NUDGE();if(TRUEFIN)TRUEFIN();return"true"}if($("tmn")){const n=clockNow();RUN.tm={h:n.h,m:n.m};tmOk();return"time"}if(document.querySelector('#modal [data-a="answer"]')){closeModal();finishJob(JB.main);return"answer"}closeModal();return"close"}
  if(s.stuck)return"STUCK "+s.t;
  if(s.act){act(s.act);if(s.act==="deliver"&&m.classList.contains("show")&&document.querySelector('#modal [data-a="answer"]')){closeModal();finishJob(JB.main)}return"act:"+s.act}
  if(s.reg){const S=sim();RUN.reg=Math.max(-1,Math.min(1,-S.base/110));let best=1e9,bb=0;for(let b=-1;b<=1;b+=.005){RUN.beat=b;const x=sim().beat;if(x<best){best=x;bb=b}}RUN.beat=bb;refresh();return"reg"}
  if(s.fix&&s.tool==="hand"&&CARD&&CARD.id===s.fix[0]){const F=FAULTS[s.fix[1]];doFix(s.fix[0],s.fix[1],F.fix==="worn"?(JB.wish==="keep"?"keep":"rep"):undefined);if($("trc")){while(NUDGE)NUDGE();if(TRUEFIN)TRUEFIN()}return"fix"}
  if(s.tool)TOOL=s.tool;const w=tgWorld(s.tg);if(!w)return"NOPOS "+JSON.stringify(s);tap(w);return(s.tool||"")+":"+s.tg.k+":"+(s.tg.id||s.tg.i||"")},
 solve(max){const log=[];for(let i=0;i<(max||600);i++){const r=RT.step();if(r==="done"||!RUN||RUN.fin){log.push("FIN");break}if(/STUCK|NOPOS/.test(r)){log.push(r);break}log.push(r)}return log}};
host.RT=RT;
/* ===================== start ===================== */
function boot(){gload();resumeRun();setView("lounge");requestAnimationFrame(loop)}
boot();
