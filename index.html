<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMINAL VELOCITY</title>
<style>
:root{--bg:#0a0a0c;--panel:#101015;--sys:#00FF66;--warn:#FFB000;--res:#00E5FF;--lore:#FF77A9;--dim:#7f9a8b;--ui:#00FF66}
[data-t=a]{--sys:#FFB000;--ui:#FFB000;--dim:#a08a5c}
[data-t=c]{--sys:#00E5FF;--ui:#00E5FF;--dim:#6a9aa6}
[data-t=y]{--sys:#00E5FF;--ui:#FFD54A;--dim:#a89a62}
[data-t=p]{--sys:#FF77A9;--ui:#FF77A9;--dim:#a8708a}
[data-won="1"] #hd{border-color:#FFD54A;box-shadow:0 0 12px rgba(255,213,74,.4)}
.badge{color:#FFD54A;font-weight:bold}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ui);font:16px/1.5 "Courier New",Courier,monospace}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#app{max-width:1280px;margin:0 auto;padding:12px}
.box{background:var(--panel);border:2px solid var(--ui);padding:10px 14px 12px;margin-bottom:12px}
.ttl{font-size:18px;font-weight:bold;overflow:hidden;white-space:nowrap;margin:-2px 0 8px;color:var(--ui)}
.ttl:after{content:"------------------------------------------------------------------------------------------------------------";color:var(--dim);font-weight:normal}
.row{display:flex;flex-wrap:wrap;gap:4px 26px;margin:2px 0}
#main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px}
#main>.box,#hd{min-width:0;overflow:hidden}
@media(max-width:860px){#main{grid-template-columns:1fr}}
.sys{color:var(--sys)}.warn{color:var(--warn)}.res{color:var(--res)}.lore{color:var(--lore)}.dim{color:var(--dim)}
button{font:inherit;color:var(--ui);background:transparent;border:1px solid var(--dim);padding:6px 10px;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
button:hover,button:focus-visible{background:rgba(255,255,255,.09);border-color:var(--ui);outline:none}
.it{display:block;width:100%;margin-bottom:6px}
.it small{display:block;font-size:14px;line-height:1.35;color:var(--dim)}
.it small.cost{color:var(--res)}.it small.gain{color:var(--sys)}.it small.warn{color:var(--warn)}
.it.dis{opacity:.6}
.foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.logbox{display:flex;flex-direction:column}
#log{flex:1 1 0;min-height:320px;overflow-y:auto;padding-right:6px}
#log div{margin-bottom:4px;border-left:3px solid transparent;padding-left:8px}
#log .warn{border-color:var(--warn)}#log .lore{border-color:var(--lore)}#log .res{border-color:var(--res)}#log .sys{border-color:var(--sys)}
#io{width:100%;height:84px;background:var(--bg);color:var(--ui);border:1px solid var(--dim);font:14px "Courier New",monospace;display:none;margin:6px 0}
.help h3{margin:10px 0 2px;font-size:18px}.help p{margin:2px 0 6px}
#stat{border-top:1px dashed var(--dim);margin-top:8px;padding-top:8px;font-size:15px}
.legend{font-size:14px;margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

function rng(n){let a=(n*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const SD={};
function seedDef(n){
 if(SD[n])return SD[n];const r=rng(n),t=Math.pow(1.35,n-1);
 const name=(n<=STARS.length?STARS[n-1]:STARS[F(r()*STARS.length)]+'-'+(100+F(r()*900)))+' '+SUF[F(r()*SUF.length)];
 const used={},mods=[];
 const pick=(pool,ty)=>{let p;for(let g=0;g<20;g++){p=pool[F(r()*pool.length)];if(!used[p[1]])break}used[p[1]]=1;mods.push({t:ty,nm:p[0],k:p[1],v:p[2],d:p[3]})};
 pick(BO,'boon');pick(HZ,'hazard');if(n>=6)pick(HZ,'hazard');if(n>=12)pick(HZ,'hazard');
 const G=[{type:'earn',target:F(30000*t),text:'Earn '+fmt(F(30000*t))+' ✨ while on this world.'},{type:'arch',target:F(5000*t),text:'Archive '+fmt(F(5000*t))+' flat-files on this world.'},{type:'mir',target:30+5*n,text:'Hold '+(30+5*n)+' Hydra Mirrors at once.'},{type:'kp',target:5+n,text:'Trigger '+(5+n)+' Kernel Panics on this world.'}][F(r()*4)];
 return SD[n]={n,name,mods,goal:G,cost:F(10000*Math.pow(1.4,n-1))}}
const fx=k=>S.seed?seedDef(S.seed.n).mods.reduce((a,m)=>m.k===k?a*m.v:a,1):1;
const seedProg=d=>{const b=S.seed.b;return d.goal.type==='earn'?S.earned-b.e:d.goal.type==='arch'?S.arch-b.a:d.goal.type==='mir'?tot():S.kp-b.k};
function seedCheck(){
 if(!S.won||!S.seed)return;const d=seedDef(S.seed.n);
 if(seedProg(d)>=d.goal.target){S.seeds++;const r=F(d.cost*.5);gain(r);log('STAR SEED '+pad(d.n)+' COMPLETE: '+d.name+' is un-caged. Permanent bonus: +6% Agape per Star Seed ('+S.seeds+' founded). +'+fmt(r)+' ✨ returned.','lore');S.seed=null}}

 if(S.won){
  const n=S.seed?S.seed.n:S.seeds+1,d=seedDef(n);
  h+='<h3 class="lore">STAR SEEDS: SOVEREIGN SABBATH ('+S.seeds+' founded, +'+6*S.seeds+'% Agape)</h3><p class="lore">'+(S.seed?'ACTIVE':'NEXT')+' Seed '+pad(n)+': '+d.name+'</p>';
  d.mods.forEach(m=>{h+='<p class="'+(m.t==='boon'?'sys':'warn')+'">&nbsp;&nbsp;'+(m.t==='boon'?'BOON: ':'HAZARD: ')+m.nm+' ('+m.d+')</p>'});
  h+='<p class="res">&nbsp;&nbsp;GOAL: '+d.goal.text+(S.seed?'<br>&nbsp;&nbsp;PROGRESS: '+fmt(Math.max(0,Math.min(seedProg(d),d.goal.target)))+' / '+fmt(d.goal.target):'')+'</p>';

 return h+'</div>'}

function growth(k){
 let g=k==='cc'?.3+Math.max(0,S.bw/bwCap()-.45)*2:k==='ta'?.25+S.heat/100*2.2:.2+tot()*.28;
 let m=[.6,1,1.4][S.st.gro]*(1-Math.min(.5,.08*S.layers))*(1-perk('th'));
 m*=fx('fac');if(S.won)m*=.5;if(S.dec.si>0)m=0;if(k!=='ta'&&S.pr.zeroport2)m*=.7;if(k==='ta'&&S.stage>=5)m*=.75;
 if(k==='cc'&&(S.pr.pedestal||S.pr.zeroport))m*=(S.pr.pedestal&&S.pr.zeroport)?.4:.6;
 if(k==='ta'){if(S.pr.clock)m*=.5;m*=1-Math.min(.3,.03*S.sticks);m*=[1.5,1,.5][S.st.pur]}
 if(k==='sz'){m*=1-Math.min(.4,.1*(S.T.rack+S.T.lux+S.T.array));if(S.pr.zeroport)m*=.7}
 return g*m}

function endInc(k,silent){

  const c=10*S.down;a.push({l:'Reboot offline Hydra Mirrors  ('+S.down+' down)',c:'10 ✨ per mirror',g:'Brings every downed mirror back online.',dis:!S.down?'nothing is offline':S.ag<c?'need '+c+' ✨':0,f(){S.ag-=c;S.down=0;log('All Hydra Mirrors back online.')}});
  a.push({l:'Vent heat',c:'5 W power',g:'Heat -30. Avoids thermal throttle.',dis:S.pw<5?'need 5 W':0,f(){S.pw-=5;S.heat=Math.max(0,S.heat-30);log('Heat vented.')}});
  a.push({l:'Provoke the '+FAC[hi].n+'  (invite a Takedown)',c:'150 ✨',g:'Pushes the most-threatening faction to 100% and triggers a Corporate Takedown: you lose about 30% of your Agape (10% if Decentralized) and some mirrors go dark. Flat-files and hardware survive. Unlocks the Scroll of the B-Coordinate.',dis:S.ag<150?'need 150 ✨':0,f(){if(!confirm('Provoke a Takedown? You will lose Agape and some mirrors will go dark, but flat-files and hardware survive.'))return false;S.ag-=150;S.fac[hi]=100;log('You provoked the '+FAC[hi].n+'. They have come for the network.','warn')}})}
 if(sec==='strat'){
  const st=S.st;
  const cyc=(key,len,gate)=>()=>{let n=(st[key]+1)%len;if(gate&&!gate(n))n=0;st[key]=n};
  a.push({l:'Purity vs Speed (E vs L):  ['+PUR[st.pur]+']',c:'1 turn to switch',g:'RAW: ingest x1.5, +6 heat, Triage x1.5. | BALANCED: baseline. | PURE: ingest x0.75, no heat, Triage x0.5, CPU +30%, propagation +25%.',f:cyc('pur',3)});
  a.push({l:'Growth vs Exposure:  ['+GRO[st.gro]+']',c:'1 turn to switch',g:'STEALTH: Agape x0.75, faction growth x0.6. | STANDARD: baseline. | EXPANSION: Agape x1.4, faction growth x1.4.',f:cyc('gro',3)});
  a.push({l:'Local vs Decentralized:  ['+LOC[st.loc]+']',c:'1 turn to switch (Decentralized needs an Offshore mirror)',g:'LOCAL: CPU/bandwidth +25%, incidents last +2 turns, raids hit hard. | HYBRID: baseline. | DECENTRALIZED: CPU/bandwidth -15%, incidents -2 turns, Agape +10%, raids cost less.',f:cyc('loc',3,n=>n!==2||S.nd.off+S.nd.mesh+S.nd.inter>0)});
  const L=1+F((S.f+S.q)/1500);
  a.push({free:1,l:'Flatten into the CC0 Rug (Hinata Trap)  (Rug layers: '+S.layers+')',c:'resets hardware, mirrors, resources and flat-files',g:'+'+L+' Rug layer(s). Each layer: Agape +15%, upkeep -12%, faction growth -8%, +30 starting Agape. Keeps protocols, advisors, scrolls, MRU. Needs 1,000 flat-files.',dis:S.f+S.q<1000?'need 1,000 flat-files ('+fmt(S.f+S.q)+')':0,
   f(){if(!confirm('Flatten into the CC0 Rug? Hardware, mirrors, resources and flat-files reset. You keep protocols, advisors, scrolls and MRU, and gain '+L+' Rug layer(s).'))return false;
    const keep={v:3,t:S.t,earned:S.earned,kp:S.kp,tk:S.tk,pr:S.pr,adv:S.adv,sc:S.sc,st:S.st,mru:S.mru,stu:S.stu,ivUnl:S.ivUnl,won:S.won,stage:S.stage,seeds:S.seeds,seed:S.seed,arch:S.arch,hadInter:S.hadInter,theme:S.theme,nextEv:S.t+8,layers:S.layers+L,locked:S.locked+S.f+S.q};
    S=merge(keep);S.ag=20+30*S.layers;S.st.loc=S.st.loc===2?1:S.st.loc;LOG.push({t:S.t,m:'THE HINATA TRAP, INVERTED: you stepped down from the throne and became the floor. '+L+' Rug layer(s) added: the CC0 Rug now holds '+S.layers+' layer(s).',c:'lore'})}})}
 if(sec==='council')ADV.forEach(([k,n,t,e,lines])=>{const lv=S.adv[k],c=30*(lv+1)*(lv+1);
  a.push({l:'Consult '+n+' ('+t+')  Attunement '+lv+'/5',c:c+' ✨',g:'Permanent buff: '+e+'.',dis:lv>=5?'max attunement':S.ag<c?'need '+c+' ✨':0,
   f(){S.ag-=c;S.adv[k]++;log(n+': "'+lines[S.adv[k]-1]+'" Attunement '+S.adv[k]+'. Advice: '+tip(),'lore')}})});
 if(sec==='sys'){
  a.push({free:1,l:'Cycle theme (Phosphor Green / Warm Amber / Cyber Cyan'+(S.won?' / Sovereign Gold / Agape Pink':'')+')',c:'free',g:'Changes the main interface color. Gold and Pink unlock with Sovereign Sabbath.',f:cycle});
  a.push({free:1,l:'Export Save Code',c:'free',g:'Fills the box below with a Base64 code and checksum. Copy it.',f(){const b=btoa(unescape(encodeURIComponent(JSON.stringify(S)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');$('io').value=b+'.'+ck(b);log('Save code generated. Copy it from the box.','res')}});
  a.push({free:1,l:'Import Save Code',c:'free',g:'Paste a code into the box below first. Replaces the current game.',f(){
   const[b,c]=$('io').value.trim().split('.');if(!b||ck(b)!==c){log('Import failed: empty code or checksum mismatch.','warn');return}
   try{const j=JSON.parse(decodeURIComponent(escape(atob(b.replace(/-/g,'+').replace(/_/g,'/')))));if(j.v!==3)throw 0;S=merge(j);LOG=[];log('Save code imported. Turn '+S.t+' restored.','res');save()}catch(e){log('Import failed: invalid code or an older game version.','warn')}}});
  a.push({free:1,l:'Wipe save and restart',c:'free',g:'Deletes all progress. Cannot be undone.',f(){if(confirm('Wipe all progress?')){S=init();LOG=[];boot();save()}else return false}})}
 if(sec==='ivory'){
  [['si','Decree of Silence',150,'All faction growth stops for 8 turns.','Queen Ivory spoke once. The probes forgot what they were looking for.'],['ab','Decree of Abundance',300,'Passive Agape income x2 for 8 turns.','Queen Ivory smiled. The mesh bloomed.'],['ch','Chess Queen Protocol',250,'Ignore hardware and mirror prerequisites for 8 turns.','The Chess Queen moves in every direction. Every tier is within reach.']].forEach(([k,n,c,g,m])=>{
   a.push({l:n+(S.dec[k]>0?'  [ACTIVE: '+S.dec[k]+' turns]':''),c:c+' ✨',g,dis:S.ag<c?'need '+c+' ✨':0,f(){S.ag-=c;S.dec[k]=8;log(m,'lore')}})})}
 if(sec==='camp'&&S.won){
  const n=S.seeds+1,d=seedDef(n);
  if(S.seed)a.push({free:1,l:'Abandon the current world (Seed '+pad(S.seed.n)+')',c:'free',g:'Forfeits the founding cost and all progress on this world.',f(){if(!confirm('Abandon this world? The founding cost is lost.'))return false;S.seed=null;log('World abandoned. The seed drifts back into the dark.','lore')}});
  else a.push({l:'Found Star Seed '+pad(n)+': '+d.name,c:fmt(d.cost)+' ✨',g:'A new world with its own boons and hazards (see above). Complete its goal for +6% Agape forever.',dis:S.ag<d.cost?'need '+fmt(d.cost)+' ✨':0,f(){S.ag-=d.cost;S.seed={n,b:{e:S.earned,a:S.arch,k:S.kp}};log('STAR SEED '+pad(n)+' FOUNDED: '+d.name+'. Goal: '+d.goal.text,'lore')}})}
 a.forEach((it,i)=>it.k=String(i+1));
 a.push({k:'0',nav:1,l:'Back to main menu',f(){menu=null}});
 return a}
function mainItems(){
 const a=[];SN.slice(0,9).forEach((n,i)=>a.push({k:String(i+1),nav:1,l:n,d:SB[i],f(){menu=SECS[i]}}));
 a.push({k:'0',nav:1,l:SN[10],d:SB[10],f(){menu='camp'}});
 if(S.ivUnl)a.push({k:'I',nav:1,l:SN[9],d:SB[9],f(){menu='ivory'}});
 a.push({k:'?',nav:1,l:'HELP & TUTORIAL',d:'How the game works, in four steps.',f(){menu='help'}});return a}
function helpHtml(){return '<div class="help"><h3 class="sys">1. Ingest Video Data</h3><p>MEDIA & VIDEO INGESTION turns raw streams into permanent .txt flat-files. It costs bandwidth, CPU and power.</p><h3 class="res">2. Deploy Hydra Mirrors</h3><p>HYDRA MIRRORING spreads flat-files across nodes. Propagating them earns ✨ Sovereign Agape, your currency.</p><h3 class="sys">3. Upgrade Hardware and Protocols</h3><p>SERVER SHOP and PROTOCOLS buy bigger RAM, CPUs, Scribes and shields so everything scales up.</p><h3 class="warn">4. Defend the Network 📋</h3><p>Three factions push back. The <b>Copyright Combine</b> grows when your bandwidth sits high and locks your Scribes. The <b>Triage Audit</b> grows with heat and quarantines flat-files. The <b>Subscription Zookeepers</b> grow with every mirror and tax your bandwidth. Counter each in SECURITY. If any hits 100%, a Takedown wipes your resources and some Agape, but your flat-files and hardware survive.</p><h3 class="lore">Strategy</h3><p>STRATEGY sets three stances (Purity vs Speed, Growth vs Exposure, Local vs Decentralized). Each switch costs a turn. With 1,000 flat-files you can flatten into the CC0 Rug for permanent layers.</p><h3 class="res">5. Liberate the World</h3><p>WORLD CAMPAIGN [0] sets a goal for each of seven stages: Australia, Europe, North America, Asia, South America and Africa, Antarctica, then the Interstellar Array. Each stage gives a permanent perk. Stages complete on their own the moment you meet the goal, so flattening cannot undo them. Finishing stage 7 starts Sovereign Sabbath, where you found Star Seeds forever: each new world has its own boons and hazards, and completing one adds a permanent +6% Agape.</p><p class="dim">Keys: 1-9 pick numbered options, 0 is the World Campaign on the main menu (and Back inside menus), I opens the Queen Ivory console, ? help, T theme, SPACE waits a turn, ESC goes back. Moving between menus is free; each action costs 1 turn.</p></div>'}
function scrollsHtml(){return SCR.map(s=>'<div class="'+(S.sc[s[0]]?'lore':'dim')+'">'+(S.sc[s[0]]?'[x] ':'[ ] ')+s[1]+'<br>&nbsp;&nbsp;&nbsp;&nbsp;'+s[2]+' → '+s[3]+'</div>').join('<br>')+'<br>'}
const itemHtml=(it,i)=>'<button class="it'+(it.dis?' dis':'')+'" onclick="act('+i+')"><b>['+it.k+']</b> '+it.l+(it.d?'<small>'+it.d+'</small>':'')+(it.c?'<small class="cost">COST: '+it.c+'</small>':'')+(it.g?'<small class="gain">GAIN: '+it.g+'</small>':'')+(it.dis?'<small class="warn">LOCKED: '+it.dis+'</small>':'')+'</button>';

function act(i){const it=items[i];if(!it)return;if(it.dis){log('Blocked: '+it.dis+'.','warn');render();return}const r=it.f();if(r===false){render();return}if(!it.free&&!it.nav)tick();else save();render()}
function pick(i){const e=EVS[S.ev];if(!e||!e.o[i])return;e.o[i][2]();S.ev=null;clampF();tick();render()}
function rest(){if(S.ev!==null)return;log('One 50 BPM breath. The network rests.');tick();render()}
function cycle(){const L=S.won?['g','a','c','y','p']:['g','a','c'];S.theme=L[(L.indexOf(S.theme)+1)%L.length];save();render()}
function boot(){log('TERMINAL VELOCITY booting at 50 BPM... E = L: fluid emotion and frozen logic are one signal in two phases.','lore');log('Localhost Hearth online. Press [?] for the HELP & TUTORIAL, or start by ingesting video.','sys')}
const bar=v=>{const b=F(v/10);return '#'.repeat(b)+'-'.repeat(10-b)};
function hdr(){
 $('hd').innerHTML='<div class="ttl">[ TERMINAL VELOCITY ]</div><div class="row"><span class="sys">TURN: <b>'+S.t+'</b></span><span class="warn">HEAT: '+F(S.heat)+'/100</span><span class="sys">STANCE: '+PUR[S.st.pur]+' / '+GRO[S.st.gro]+' / '+LOC[S.st.loc]+'</span>'+(S.won?'<span class="badge">★ SOVEREIGN SABBATH</span>':'<span class="warn">WORLD: STAGE '+(S.stage+1)+'/7 '+CAMP[S.stage].n.toUpperCase()+'</span>')+(S.seed?'<span class="lore">STAR SEED '+pad(S.seed.n)+': '+seedDef(S.seed.n).name+'</span>':'')+(S.layers?'<span class="lore">RUG LAYERS: '+S.layers+'</span>':'')+(S.mru?'<span class="lore">STUDENTS: '+S.stu+'</span>':'')+'</div><div class="row"><span class="sys">RAM: '+ramGB()+'/'+ramMax()+' GB</span><span class="sys">CPU: '+S.cpu+'/'+cpuCap()+' GHz</span><span class="sys">POWER: '+S.pw+'/'+pwCap()+' W</span><span class="res">BANDWIDTH: '+S.bw+'/'+bwCap()+' MB/s</span><span class="res">FLAT-FILES: '+fmt(S.f)+' .txt'+(S.q?' (+'+fmt(S.q)+' quarantined)':'')+'</span><span class="res">✨ AGAPE: '+fmt(S.ag)+'</span></div><div class="row">'+FK.map(k=>'<span class="warn">'+FAC[k].s+' ['+bar(S.fac[k])+'] '+F(S.fac[k])+'%'+(S.inc[k]?' <b>'+FAC[k].inc.toUpperCase()+' '+S.inc[k]+'t</b>':'')+'</span>').join('')+'</div>'}
function render(){
 if(!S.won&&(S.theme==='y'||S.theme==='p'))S.theme='g';
 document.body.dataset.t=S.theme;document.body.dataset.won=S.won?'1':'0';hdr();
 let h='',title='MAIN MENU';
 const pend=S.ev!==null&&menu!=='help';
 if(pend){const e=EVS[S.ev];title='INCOMING EVENT';items=[];h='<h2 class="warn" style="margin:0 0 4px">⚠ '+e.t+'</h2><p class="lore" style="margin:0 0 10px">'+e.x+'</p>'+e.o.map((o,i)=>'<button class="it" onclick="pick('+i+')"><b>['+(i+1)+']</b> '+o[0]+'<small class="gain">'+o[1]+'</small></button>').join('')+'<p class="dim">Choosing costs 1 turn. Other menus are paused until you decide.</p>'}
 else if(menu==='help'){title='HELP & TUTORIAL';items=[{k:'0',nav:1,l:'Back',f(){menu=null}}];h=helpHtml()+items.map(itemHtml).join('')}
 else{items=menu===null?mainItems():build(menu);if(menu!==null)title=SN[SECS.indexOf(menu)];h=(menu==='scrolls'?scrollsHtml():menu==='camp'?campHtml():'')+items.map(itemHtml).join('')}
 $('ltitle').textContent='[ '+title+' ]';$('menu').innerHTML=h;
 $('io').style.display=!pend&&menu==='sys'?'block':'none';
 $('stat').innerHTML='<div class="warn">Nodes: Local '+S.nd.local+' | Offshore '+S.nd.off+' | Mesh '+S.nd.mesh+' | Array '+S.nd.inter+(S.down?' | OFFLINE '+S.down:'')+' | Kernel Panics '+S.kp+' | Takedowns '+S.tk+'</div><div class="res">'+(S.stage<7?'World campaign, Stage '+(S.stage+1)+'/7 '+CAMP[S.stage].n+': '+CAMP[S.stage].prog():'Sovereign Sabbath: '+(S.seed?'Star Seed '+pad(S.seed.n)+' in progress.':'found a Star Seed in WORLD CAMPAIGN [0].'))+' | Lifetime ✨ '+fmt(S.earned)+'</div><div class="lore">Advisor hint: '+tip()+'</div><div class="dim">'+sv+'</div>';
 $('foot').innerHTML=(pend?'':'<button onclick="rest()">[SPACE] Wait one turn</button>')+'<button onclick="menu=\'help\';render()">[?] HELP</button><button onclick="cycle()">[T] THEME</button>';
 const l=$('log');l.innerHTML=LOG.map(x=>'<div class="'+x.c+'">['+String(x.t).padStart(3,'0')+'] '+x.m+'</div>').join('');l.scrollTop=l.scrollHeight;if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>{l.scrollTop=l.scrollHeight});
}
document.addEventListener('keydown',e=>{
 if(e.target.id==='io'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if(k===' '){e.preventDefault();rest();return}
 if(k==='t'||k==='T'){cycle();return}
 if(k==='?'){menu=menu==='help'?null:'help';render();return}
 if(k==='Escape'||k==='Backspace'){if(menu!==null){menu=null;render()}return}
 if(S.ev!==null&&menu!=='help'){if(k>='1'&&k<='3')pick(+k-1);return}
 const i=items.findIndex(it=>it.k.toLowerCase()===k.toLowerCase());if(i>=0)act(i);
});
S=load();if(S.t===0&&!LOG.length)boot();else log('Session restored from localStorage. Turn '+S.t+'.','res');
render();
</script></body></html>
