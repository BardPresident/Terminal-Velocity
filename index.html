button{font:inherit;color:var(--ui);background:transparent;border:1px solid var(--dim);padding:6px 10px;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}

.it{display:block;width:100%;margin-bottom:6px}

.it small.cost{color:var(--res)}.it small.gain{color:var(--sys)}.it small.warn{color:var(--warn)}

.bn.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.bn.gold{color:#FFD54A;border-color:#FFD54A;box-shadow:0 0 50px rgba(255,213,74,.55)}.bn.red{color:var(--warn);border-color:var(--warn)}

@keyframes bloomg{0%{box-shadow:inset 0 0 160px rgba(255,213,74,.4)}100%{box-shadow:inset 0 0 0 rgba(255,213,74,0)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}#fx.b{animation:bloom .7s ease-out}#fx.g{animation:bloomg 1.4s ease-out}

.foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

#io{width:100%;height:84px;background:var(--bg);color:var(--ui);border:1px solid var(--dim);font:14px "Courier New",monospace;display:none;margin:6px 0}
.help h3{margin:10px 0 2px;font-size:18px}.help p{margin:2px 0 6px}
#stat{border-top:1px dashed var(--dim);margin-top:8px;padding-top:8px;font-size:15px}
.legend{font-size:14px;margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
html,body{overflow-x:hidden}
@media(min-width:861px) and (min-height:520px) and (orientation:landscape){
html,body{height:100%;overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 12px}
#hd{flex:0 0 auto;margin-bottom:10px}

function cExpand(args){const o=[];for(const a of args){if(!/[*?]/.test(a)){o.push(a);continue}
 const i=a.lastIndexOf("/");const dir=i<0?".":(a.slice(0,i)||"/");const pat=a.slice(i+1);const d=vres(dir);
 if(!d||d.t!=="d"){o.push(a);continue}
 const re=new RegExp("^"+pat.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*").replace(/\?/g,".")+"$");
 const m=d.kids().filter(k=>re.test(k.n)&&(pat[0]==="."||k.n[0]!=="."));
 if(!m.length)o.push(a);else m.forEach(k=>o.push((i<0?"":a.slice(0,i+1))+k.n))}
 return o}

 case "council":{for(const a of ADV)if(l.indexOf("Consult "+a[1])===0)return "consult "+a[0];return null}
