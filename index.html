<html lang="en"><head><meta charset="utf-8">

<title>Terminal Velocity OS</title>
<meta name="description" content="Terminal Velocity OS - a single-file HTML operating system. Ships with the game Terminal Velocity. CC0.">
<style>
/* ===== Terminal Velocity OS - CSS. Theme colours are CSS variables set from THEMES in the script. ===== */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ff);-webkit-tap-highlight-color:transparent}

#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

.dic{width:82px;padding:6px 2px 4px;text-align:center;border-radius:6px;cursor:pointer;user-select:none;border:1px solid transparent;font-size:12px;line-height:1.2;text-shadow:0 1px 3px #000a}

.dic:hover,.dic:focus{background:var(--hv);border-color:var(--bd);outline:0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--bd);border-radius:var(--rad);box-shadow:0 10px 36px rgba(0,0,0,.55);min-width:240px;min-height:120px;overflow:hidden}

.tb{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 10px;background:var(--pn2);border-bottom:1px solid var(--bd);user-select:none;flex:none;touch-action:none}

#snap{position:absolute;border:2px dashed var(--ac);background:var(--aca);z-index:5000;display:none;border-radius:6px;pointer-events:none}

#start{position:fixed;left:6px;bottom:48px;width:min(420px,calc(100vw - 12px));max-height:min(560px,calc(100vh - 60px));z-index:6500;display:none;flex-direction:column;background:var(--pn);border:1px solid var(--ac);border-radius:var(--rad);box-shadow:0 12px 44px rgba(0,0,0,.65)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--bd);background:var(--pn2);border-radius:5px;cursor:pointer;min-height:26px;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac)}.btn.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}.btn.pri:hover{color:var(--bg);filter:brightness(1.1)}.btn.sm{padding:1px 8px;min-height:22px}.btn.on{border-color:var(--ac);color:var(--ac)}
.btn:disabled{opacity:.4;pointer-events:none}
input.t,select.t,textarea.t{padding:4px 8px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;outline:0;min-width:0}

.row{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}

#ctx{position:fixed;z-index:9500;min-width:170px;background:var(--pn);border:1px solid var(--ac);border-radius:6px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.6);display:none}
#ctx div{padding:5px 12px;border-radius:4px;cursor:pointer;display:flex;gap:10px;align-items:center}#ctx div:hover{background:var(--ac);color:var(--bg)}#ctx hr{border:0;border-top:1px solid var(--bd);margin:3px 0}#ctx .d{opacity:.4;pointer-events:none}
#modal{position:fixed;inset:0;z-index:9400;background:rgba(0,0,0,.55);display:none;place-items:center}
#modal.on{display:grid}
.dlg{background:var(--pn);border:1px solid var(--ac);border-radius:var(--rad);padding:16px;width:min(520px,calc(100vw - 20px));max-height:calc(100vh - 30px);display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 50px rgba(0,0,0,.7)}
.dlg h3{margin:0;color:var(--ac);letter-spacing:.04em}.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;right:10px;bottom:52px;z-index:9600;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:var(--pn);border:1px solid var(--ac);border-left-width:4px;border-radius:5px;padding:8px 12px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:wopen .15s}
.toast.er{border-color:var(--er)}
#spot{position:fixed;inset:0;z-index:9450;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:flex-start;padding-top:12vh}
#spot.on{display:flex}#spot .bx{width:min(620px,calc(100vw - 20px));background:var(--pn);border:1px solid var(--ac);border-radius:var(--rad);overflow:hidden;box-shadow:0 14px 50px #000a}
#spot input{width:100%;padding:14px;background:transparent;border:0;border-bottom:1px solid var(--bd);outline:0;font-size:16px}
#spot .rs{max-height:50vh;overflow:auto}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px;padding:8px;align-content:start}
.fl .it{padding:8px 4px;text-align:center;border-radius:6px;cursor:pointer;border:1px solid transparent;word-break:break-word;font-size:12px;line-height:1.25;user-select:none}
.fl .it svg{width:30px;height:30px;display:block;margin:0 auto 4px;color:var(--ac)}.fl .it.d svg{color:var(--ac2)}
.fl .it:hover{background:var(--hv)}.fl .it.sel{background:var(--aca);border-color:var(--ac)}
.fl.lst{display:block;padding:0}.fl.lst .it{display:flex;gap:10px;text-align:left;align-items:center;padding:3px 10px;border-radius:0;border:0;border-bottom:1px solid transparent}.fl.lst .it svg{width:16px;height:16px;margin:0}.fl.lst .it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl.lst .it .m{color:var(--dim);width:80px;text-align:right}
.tabs{display:flex;gap:2px;background:var(--pn2);border-bottom:1px solid var(--bd);overflow-x:auto;flex:none}
.tab{padding:5px 12px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--bd);color:var(--dim);display:flex;gap:8px;align-items:center}.tab.on{background:var(--pn);color:var(--fg);box-shadow:inset 0 -2px var(--ac)}.tab i{font-style:normal;opacity:.5}.tab i:hover{opacity:1;color:var(--er)}
.side{width:150px;flex:none;border-right:1px solid var(--bd);background:var(--pn2);overflow:auto;padding:4px}
.side div{padding:6px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center}.side div:hover{background:var(--hv)}.side div.on{background:var(--aca);color:var(--ac)}
pre.out{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.swc{border:2px solid var(--bd);border-radius:8px;padding:8px;cursor:pointer}.swc.on{border-color:var(--ac)}.swc .bar{height:34px;border-radius:5px;display:flex;overflow:hidden;margin-bottom:6px}.swc .bar i{flex:1}
@media(max-width:700px){#mcd{display:none}.tb button[title=Maximise],.tb button[title=Restore]{display:none}.win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}.win .rz{display:none}.fl.lst .it{padding:8px 10px;min-height:42px;border-bottom:1px solid var(--bd)}.fl.lst .it .n{white-space:normal;overflow-wrap:anywhere;line-height:1.25}.fl.lst .it .m{width:auto!important;min-width:0;font-size:11px;white-space:nowrap}.fl.lst .it .m+.m{display:none}.sc-side{display:none;position:absolute;left:0;top:0;bottom:0;width:82%!important;max-height:none!important;z-index:6;border-right:1px solid var(--bd)!important;border-bottom:0!important;box-shadow:6px 0 18px #000a}.sc-side.open{display:block}.sc-sbtn{display:inline-flex!important}.mm-side{width:auto!important;max-height:34%;border-right:0!important;border-bottom:1px solid var(--bd);flex:none}.mm-row,.md-row{flex-direction:column}.mm-cover{width:72px!important;height:72px!important}.mm-ctl{flex-wrap:wrap}.mm-ctl input[type=range]:not([max="1"]){flex:1 1 100%!important;order:9;min-width:0}.md-pl{width:auto!important;max-height:36%;border-left:0!important;border-top:1px solid var(--bd)}.bk-lib{width:100%!important;border-right:0!important}.cm-top{flex-wrap:wrap!important;gap:4px}.cm-top .grow{display:none}.cm-top select{flex:1 1 30%;min-width:0;max-width:48%}.row{flex-wrap:wrap}.btn{min-height:34px}.tk{flex:0 0 40px;min-width:40px;padding:0 8px}.tk .ti{display:none}#tray .hide{display:none}#dic{flex-flow:row wrap;align-content:flex-start;right:8px}.side{width:96px}}
#boot{position:fixed;inset:0;z-index:9900;background:var(--bg);color:var(--ac);padding:14px 16px;font:12px/1.5 var(--ff);overflow:hidden;display:flex;flex-direction:column}
#boot pre{margin:0;white-space:pre;color:var(--ac)}#boot #bl{flex:1;overflow:hidden;white-space:pre-wrap;word-break:break-all;display:flex;flex-direction:column;justify-content:flex-end}
#boot .ok{color:var(--ok)}#boot .wn{color:var(--wn)}#boot .er{color:var(--er)}#boot .dm{color:var(--dim)}
#boot .pb{height:6px;background:var(--bd);margin-top:8px;border-radius:3px;overflow:hidden}#boot .pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
.kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
canvas{display:block}
.sc-sbtn{display:none}.sc-player:fullscreen{display:flex;flex-direction:column;background:#000;max-height:none}.sc-player:fullscreen .sc-stage{flex:1;height:auto!important}.sc-player:fullscreen .sc-bar{background:#000c}
.rd h1,.rd h2,.rd h3{color:var(--ac);line-height:1.25}.rd code,.rd pre{background:var(--bg);padding:1px 5px;border-radius:4px}.rd pre{padding:10px;overflow:auto;white-space:pre-wrap}.rd blockquote{border-left:3px solid var(--ac);margin:8px 0;padding:2px 12px;color:var(--dim)}.rd p{margin:.7em 0}
#boot::after{content:'press any key to skip delays';position:absolute;right:16px;top:12px;color:var(--dim);font-size:11px}
#boot,#boot *{-webkit-text-size-adjust:100%;text-size-adjust:100%}#boot #blogo{margin-bottom:8px;overflow:visible}#boot #blogo svg{filter:drop-shadow(0 0 5px var(--ac))}
@media(max-width:720px){#boot{padding:max(18px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));font-size:11px}

</style></head><body>

<div id="desk"><div id="dic"></div><div id="snap"></div></div>

<!-- The game Terminal Velocity, embedded as inert text and run in a window. Source of the standalone game is unchanged. -->
<script type="text/plain" id="tvgame"><!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMINAL VELOCITY</title>
<style>
:root{--bg:#0a0a0c;--panel:#101015;--sys:#00FF66;--warn:#FFB000;--res:#00E5FF;--lore:#FF77A9;--dim:#7f9a8b;--ui:#00FF66}
[data-t=a]{--sys:#FFB000;--ui:#FFB000;--dim:#a08a5c}
[data-t=c]{--sys:#00E5FF;--ui:#00E5FF;--dim:#6a9aa6}
[data-t=y]{--sys:#00E5FF;--ui:#FFD54A;--dim:#a89a62}
[data-t=p]{--sys:#FF77A9;--ui:#FF77A9;--dim:#a8708a}
[data-won="1"] #hd{border-color:#FFD54A;box-shadow:0 0 12px rgba(255,213,74,.4)}
.badge{color:#FFD54A;font-weight:bold}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ui);font:16px/1.5 "Courier New",Courier,monospace}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#app{max-width:1280px;margin:0 auto;padding:12px}
.box{background:var(--panel);border:2px solid var(--ui);padding:10px 14px 12px;margin-bottom:12px}
.ttl{font-size:18px;font-weight:bold;overflow:hidden;white-space:nowrap;margin:-2px 0 8px;color:var(--ui)}
.ttl:after{content:"------------------------------------------------------------------------------------------------------------";color:var(--dim);font-weight:normal}
.row{display:flex;flex-wrap:wrap;gap:4px 26px;margin:2px 0}
#main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px}
#main>.box,#hd{min-width:0;overflow:hidden}
@media(max-width:860px){#main{grid-template-columns:1fr}}
.sys{color:var(--sys)}.warn{color:var(--warn)}.res{color:var(--res)}.lore{color:var(--lore)}.dim{color:var(--dim)}
button{font:inherit;color:var(--ui);background:transparent;border:1px solid var(--dim);padding:6px 10px;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
button:hover,button:focus-visible{background:rgba(255,255,255,.09);border-color:var(--ui);outline:none}
.it{display:block;width:100%;margin-bottom:6px}
.it small{display:block;font-size:14px;line-height:1.35;color:var(--dim)}
.it small.cost{color:var(--res)}.it small.gain{color:var(--sys)}.it small.warn{color:var(--warn)}
.it.dis{opacity:.6}
.bn{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);z-index:50;pointer-events:none;opacity:0;max-width:92vw;text-align:center;font:bold clamp(22px,4.2vw,56px)/1.2 "Courier New",monospace;color:var(--ui);background:rgba(5,8,6,.88);border:3px solid var(--ui);padding:.4em .8em;text-shadow:0 0 14px currentColor;box-shadow:0 0 40px rgba(0,255,102,.35);transition:opacity .25s,transform .25s}
.bn.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.bn.gold{color:#FFD54A;border-color:#FFD54A;box-shadow:0 0 50px rgba(255,213,74,.55)}.bn.red{color:var(--warn);border-color:var(--warn)}
@keyframes bloom{0%{box-shadow:inset 0 0 120px rgba(0,255,102,.28)}100%{box-shadow:inset 0 0 0 rgba(0,255,102,0)}}
@keyframes bloomg{0%{box-shadow:inset 0 0 160px rgba(255,213,74,.4)}100%{box-shadow:inset 0 0 0 rgba(255,213,74,0)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}#fx.b{animation:bloom .7s ease-out}#fx.g{animation:bloomg 1.4s ease-out}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.mgrid .it{margin:0;padding:3px 8px;min-width:0;font-size:15px;line-height:1.25;text-align:left}.mgrid .it small{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:900px){.mgrid{grid-template-columns:1fr}}
@media(min-width:861px) and (max-height:700px) and (orientation:landscape){#stat>div:not(.lore){display:none}}
.foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.logbox{display:flex;flex-direction:column}
#log{flex:1 1 0;min-height:320px;overflow-y:auto;padding-right:6px}
#log div{margin-bottom:4px;border-left:3px solid transparent;padding-left:8px}
#log .warn{border-color:var(--warn)}#log .lore{border-color:var(--lore)}#log .res{border-color:var(--res)}#log .sys{border-color:var(--sys)}
#io{width:100%;height:84px;background:var(--bg);color:var(--ui);border:1px solid var(--dim);font:14px "Courier New",monospace;display:none;margin:6px 0}
.help h3{margin:10px 0 2px;font-size:18px}.help p{margin:2px 0 6px}
#stat{border-top:1px dashed var(--dim);margin-top:8px;padding-top:8px;font-size:15px}
.legend{font-size:14px;margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
html,body{overflow-x:hidden}
@media(min-width:861px) and (min-height:520px) and (orientation:landscape){
html,body{height:100%;overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 12px}
#hd{flex:0 0 auto;margin-bottom:10px}
#main{flex:1 1 0;min-height:0;grid-template-rows:minmax(0,1fr)}
#main>.box{margin-bottom:0;display:flex;flex-direction:column;min-height:0}
.lbox #menu{flex:1 1 0;min-height:0;overflow-y:auto;padding-right:6px}
.lbox #io,.lbox #stat,.lbox .foot{flex:0 0 auto}
.lbox #stat{font-size:12.5px;line-height:1.25}.lbox #stat .dim{display:none}.lbox #stat div{margin:0}
.lbox .foot{margin-top:6px}.lbox .foot button{padding:4px 8px;font-size:14px}

const infMil=n=>{let m=0;for(const th of [10,25,50])if(n>=th)m++;if(n>=100)m+=1+F(Math.log2(n/100));return Math.pow(2,m)};
const infNext=n=>{for(const th of [10,25,50,100])if(n<th)return th;let t=100;while(t<=n)t*=2;return t};

const infN=()=>infKeys().reduce((a,t)=>a+S.inf[t],0);

const fmtN=n=>{n=Math.floor(n);if(!isFinite(n))return '∞';if(n<1e6)return n.toLocaleString('en-US');let i=0,v=n;while(v>=1000&&i<SUFX.length-1){v/=1000;i++}if(v>=1000)return n.toExponential(2).replace('e+','e');return (v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+SUFX[i]};

function helpHtml(){return '<div class="help"><h3 class="sys">1. Record, then Scribe</h3><p>Flat-files only come from transcripts, and transcripts only come from footage. In the MEDIA STUDIO, record street footage, then run a Scribe to turn it into permanent .txt flat-files. Filming is what angers the three factions and heats the network, so scribe promptly and counter them.</p><h3 class="res">2. Deploy Hydra Mirrors</h3><p>HYDRA MIRRORING spreads flat-files across nodes. Propagating them earns ✨ Sovereign Agape, your currency.</p><h3 class="sys">3. Upgrade Hardware and Protocols</h3><p>SERVER SHOP and PROTOCOLS buy bigger RAM, CPUs, Scribes and shields so everything scales up.</p><h3 class="warn">4. Defend the Network 📋</h3><p>Three factions push back. The <b>Copyright Combine</b> grows when your bandwidth sits high and locks your Scribes. The <b>Triage Audit</b> grows with heat and quarantines flat-files. The <b>Subscription Zookeepers</b> grow with every mirror and tax your bandwidth. Counter each in SECURITY. If any hits 100%, a Takedown wipes your resources and some Agape, but your flat-files and hardware survive.</p><h3 class="lore">Strategy</h3><p>STRATEGY sets three stances (Purity vs Speed, Growth vs Exposure, Local vs Decentralized). Each switch costs a turn. With 1,000 flat-files you can flatten into the CC0 Rug for permanent layers.</p><h3 class="res">5. Liberate the World</h3><p>WORLD CAMPAIGN [0] sets a goal for each of seven stages: Australia, Europe, North America, Asia, South America and Africa, Antarctica, then the Interstellar Array. Each stage gives a permanent perk. Stages complete on their own the moment you meet the goal, so flattening cannot undo them. Finishing stage 7 starts Sovereign Sabbath, where you found Star Seeds forever: each new world has its own boons and hazards, and completing one adds a permanent, slowly diminishing Agape bonus.</p><h3 class="sys">6. Make Media</h3><p>In the MEDIA STUDIO, record street footage (raw, hot and high-volume), then run a Scribe to turn it into flat-files and cool the network. Scribe Engines also convert stored footage on their own. In PUBLISHING [P], bind flat-files into Scrolls, Books and Anthologies for permanent income and students (needs the Sync Bell). In the ACOUSTIC STUDIO [M], compose 12-track albums at 50 BPM and play them to calm the factions.</p><h3 class="res">7. Build Forever</h3><p>Once you own an Interstellar Substrate Array and an Interstellar mirror, <b>INFRASTRUCTURE [D]</b> opens an endless ladder of facilities: Orbital Relay Stations, Lunar Vaults, Dyson Swarm Lattices and beyond. Every unit adds Agape weight plus CPU and bandwidth. Prices climb 22% per unit, the output of a tier doubles at 10, 25, 50 and 100 units, and the next tier unlocks when you own 5 of the last. Bigger empires draw more attention: factions grow faster, and a counter you spam will adapt and weaken for a few turns, so rotate your tools. <b>Fortify</b> buys permanent defense. Use bulk x10 / x100 / MAX to build quickly.</p><h3 class="sys">8. Use the Console</h3><p>Press / (or tap the prompt under the log) to type real shell commands. Looking around is free (ls, cat, grep, cd, status, mission, help); actions cost one turn, exactly like the buttons (record, scribe, sync, buy, rm ...). Clicking a button types its command into the log.</p><p>Your archive is in <b>flat-files/</b>. The first folder is open from turn 0 and more files unlock as you archive flat-files. There is always one <b>archive mission</b>: sync a file or a whole folder to a mirror node (type <b>mission</b>, or use the Sync mission target button in HYDRA MIRRORING).</p><p>Type <b>help</b> for the full manual, <b>help COMMAND</b> for details and examples, <b>help topics</b> for guides (quickstart, paths, pipes, missions, manifest, turns, scripts, deletion). Every command also answers <b>--help</b>.</p><p class="dim">Keys: P publishing, M acoustic studio, 1-9 pick numbered options, 0 is the World Campaign on the main menu (and Back inside menus), I opens the Queen Ivory console, ? help, T theme, SPACE waits a turn, ESC goes back. Moving between menus is free; each action costs 1 turn.</p></div>'}

function cLev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?0:j}for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
